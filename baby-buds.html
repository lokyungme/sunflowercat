<script>(()=>{const works=[...document.querySelectorAll('.bud')],box=document.getElementById('lightbox'),img=box.querySelector('.lb-img'),count=box.querySelector('.lb-count');let i=0;function show(n){i=(n+works.length)%works.length;img.src=works[i].dataset.src;count.textContent=(i+1)+' / '+works.length}works.forEach((w,n)=>w.addEventListener('click',e=>{e.preventDefault();show(n);box.classList.add('open');document.body.style.overflow='hidden'}));function close(){box.classList.remove('open');document.body.style.overflow=''}box.querySelector('.lb-close').onclick=close;box.querySelector('.lb-prev').onclick=()=>show(i-1);box.querySelector('.lb-next').onclick=()=>show(i+1);document.addEventListener('keydown',e=>{if(!box.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)})})();</script></body></html>
