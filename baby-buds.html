<!doctype html>

<style>
.buds-main{padding:0 28px 100px 38px;overflow:hidden}.buds-page{width:100%;margin:0;padding-top:76px}.buds-back{margin:0 0 34px 1vw;font-size:11px}.buds-back a{text-decoration:none}.buds-field{position:relative;height:78vh;min-height:620px;max-height:900px;margin:20px 1vw 190px}.bud{position:absolute;display:block;cursor:zoom-in;transition:transform .25s ease}.bud:hover{transform:scale(1.035);z-index:3}.bud img{display:block;width:100%;height:auto;box-shadow:0 8px 28px rgba(0,0,0,.035)}
.bud:nth-child(1){width:15%;left:7%;top:8%}.bud:nth-child(2){width:18%;left:27%;top:39%}.bud:nth-child(3){width:14%;left:47%;top:4%}.bud:nth-child(4){width:17%;left:67%;top:28%}.bud:nth-child(5){width:13%;left:84%;top:2%}.bud:nth-child(6){width:16%;left:8%;top:57%}.bud:nth-child(7){width:15%;left:53%;top:62%}
.lightbox{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:1100;display:none;align-items:center;justify-content:center;padding:24px 60px 42px}.lightbox.open{display:flex}.lb-img{display:block;max-width:calc(100vw - 120px);max-height:calc(100vh - 80px);width:auto;height:auto}.lb-close{position:fixed;right:20px;top:14px;border:0;background:none;font-size:22px;font-weight:300;cursor:pointer}.lb-zone{position:fixed;top:45px;bottom:45px;width:35%;z-index:2}.lb-prev{left:0;cursor:w-resize}.lb-next{right:0;cursor:e-resize}.lb-count{position:fixed;right:24px;bottom:18px;font-size:10px;opacity:.45}
@media(max-width:820px){.buds-main{padding:0 18px 70px}.buds-page{padding-top:58px}.buds-back{margin:0 0 48px}.buds-field{height:auto;min-height:0;max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:34px 22px;margin:0 4vw 70px}.bud:nth-child(n){position:static;width:auto}.bud:nth-child(3),.bud:nth-child(6){transform:translateY(28px)}.bud:hover{transform:none}.lightbox{padding:48px 12px}.lb-img{max-width:100%;max-height:calc(100vh - 100px)}}
</style>
<style>

.studio-now{color:#999!important;font-size:10px!important;line-height:1.5!important}.studio-note a:hover{text-decoration:underline!important;text-underline-offset:3px}
.buds-main{width:calc(100% - 270px)!important;max-width:none!important;margin:0 0 0 270px!important}
@media(max-width:700px){.sidebar{width:148px!important;padding:16px 13px 22px!important}.name{width:58px!important;margin-bottom:24px!important}.projects{gap:10px!important}.projects a{display:block!important;font-size:12px!important}.project-year{display:block!important;font-size:10px!important;margin-bottom:1px!important}.menu-secondary{gap:9px!important;margin-top:auto!important;padding-top:32px!important}.menu-secondary a{font-size:9px!important}.side-top{margin-bottom:20px!important}.buds-main{width:calc(100% - 148px)!important;margin-left:148px!important}}
.mobile-menu-button{display:none}
@media(max-width:980px){
  html,body{width:100%;overflow-x:hidden}
  .site{display:block!important;width:100%;min-height:100vh}
  .sidebar{position:relative!important;inset:auto!important;width:100%!important;min-height:0!important;padding:18px 18px 16px!important;overflow:visible!important}
  .name{width:58px!important;margin-bottom:18px!important}

  .mobile-menu-button{display:block;width:max-content;min-height:32px;padding:0;border:0;background:none;color:#111;font:12px Arial,Helvetica,sans-serif;text-align:left;cursor:pointer}

  .projects{gap:10px!important}

  .menu-secondary{gap:12px!important;margin-top:0!important;padding-top:34px!important}

  .buds-main{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:0 18px 70px!important;overflow:visible!important}
  .buds-page{padding-top:12px!important}
  .buds-field{height:auto;min-height:0;max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:34px 22px;margin:0 0 70px}
  .bud:nth-child(n){position:static;width:auto}

  .lb-img{max-width:100%;max-height:calc(100svh - 100px)}
}

<script>(()=>{const menuButton=document.querySelector('.mobile-menu-button'),sidebar=document.querySelector('.sidebar');menuButton.addEventListener('click',()=>{const isOpen=sidebar.classList.toggle('menu-open');menuButton.setAttribute('aria-expanded',String(isOpen));menuButton.textContent=isOpen?'works −':'works +'});const works=[...document.querySelectorAll('.bud')],box=document.getElementById('lightbox'),img=box.querySelector('.lb-img'),count=box.querySelector('.lb-count');let i=0;function show(n){i=(n+works.length)%works.length;img.src=works[i].dataset.src;count.textContent=(i+1)+' / '+works.length}works.forEach((w,n)=>w.addEventListener('click',e=>{e.preventDefault();show(n);box.classList.add('open');document.body.style.overflow='hidden'}));function close(){box.classList.remove('open');document.body.style.overflow=''}box.querySelector('.lb-close').onclick=close;box.querySelector('.lb-prev').onclick=()=>show(i-1);box.querySelector('.lb-next').onclick=()=>show(i+1);document.addEventListener('keydown',e=>{if(!box.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)})})();</script></body></html>
