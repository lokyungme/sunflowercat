<style>
*{box-sizing:border-box}

body{overflow-x:hidden}

.page{display:block!important;max-width:none!important;width:calc(100% - 270px)!important;margin:0 0 0 270px!important;padding:20px 10px 80px!important}

.chapter{margin:0 auto 190px;max-width:1500px}

.slide-button{display:flex;width:100%;height:92vh;margin:0;padding:0;border:0;background:none;align-items:center;justify-content:center;cursor:pointer}
.slide-image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.slide-footer{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;color:#aaa;font-size:9px;line-height:1.3;pointer-events:none}

<style>

</style>

<dialog class="painting-viewer" aria-label="Sunflower paintings slideshow">
<button class="painting-close" type="button" aria-label="Close slideshow">close ×</button>
<div class="painting-stage"><img alt="Sunflower painting"></div>
<div class="painting-controls"><button class="painting-prev" aria-label="Previous painting">←</button><span class="painting-count" aria-live="polite"></span><button class="painting-next" aria-label="Next painting">→</button></div>
</dialog>
<script>
(()=>{
 const paths=["birth%20of%20a%20sunflower/2%20Color%20Paintings/05.jpg", "birth%20of%20a%20sunflower/2%20Color%20Paintings/055.jpg", "birth%20of%20a%20sunflower/2%20Color%20Paintings/06.jpg", "birth%20of%20a%20sunflower/2%20Color%20Paintings/07.jpg", "birth%20of%20a%20sunflower/2%20Color%20Paintings/08.jpg", "birth%20of%20a%20sunflower/2%20Color%20Paintings/09.jpg", "birth%20of%20a%20sunflower/2%20Color%20Paintings/10.jpg", "birth%20of%20a%20sunflower/2%20Color%20Paintings/11.jpg", "birth%20of%20a%20sunflower/2%20Color%20Paintings/12.jpg", "birth%20of%20a%20sunflower/2%20Color%20Paintings/13.jpg", "birth%20of%20a%20sunflower/2%20Color%20Paintings/14.jpg", "birth%20of%20a%20sunflower/2%20Color%20Paintings/15.jpg", "birth%20of%20a%20sunflower/2%20Color%20Paintings/16.jpg"];
 const viewer=document.querySelector('.painting-viewer');
 const trigger=document.querySelector('.sunflower-preview');
 const image=viewer.querySelector('.painting-stage img');
 const count=viewer.querySelector('.painting-count');
 const cache=new Map();let index=0,request=0,previousOverflow='';
 function load(i){
  if(!cache.has(i))cache.set(i,new Promise((resolve,reject)=>{
   const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>{cache.delete(i);reject(new Error('Image unavailable'));};img.src=paths[i];
  }));return cache.get(i);
 }
 async function show(i){
  index=(i+paths.length)%paths.length;const target=index,token=++request;
  try{const loaded=await load(target);if(token!==request||!viewer.open)return;
   image.src=loaded.src;image.alt='Sunflower painting '+(target+1);
   count.textContent=(target+1)+' / '+paths.length;
   load((target+1)%paths.length).catch(()=>{});load((target+paths.length-1)%paths.length).catch(()=>{});
  }catch(e){if(token===request)count.textContent='Image unavailable';}
 }
 trigger.addEventListener('click',()=>{previousOverflow=document.body.style.overflow;document.body.style.overflow='hidden';viewer.showModal();show(0);});
 viewer.querySelector('.painting-close').addEventListener('click',()=>viewer.close());
 viewer.querySelector('.painting-next').addEventListener('click',()=>show(index+1));
 viewer.querySelector('.painting-prev').addEventListener('click',()=>show(index-1));
 image.addEventListener('click',()=>show(index+1));
 viewer.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(index+1);}if(e.key==='ArrowLeft'){e.preventDefault();show(index-1);}});
 viewer.addEventListener('close',()=>{request++;document.body.style.overflow=previousOverflow;trigger.focus({preventScroll:true});});
 const warm=()=>load(0).catch(()=>{});
 trigger.addEventListener('pointerenter',warm,{once:true});trigger.addEventListener('focus',warm,{once:true});
})();
</script>
