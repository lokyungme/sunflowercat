<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sister — kyung-me</title>
<link rel="stylesheet" href="style.css">
<style>
html,body{height:auto!important;min-height:100%;overflow-x:hidden!important;overflow-y:auto!important}
.site{display:block!important;min-height:100vh}
.sister-works-bar{position:fixed;z-index:100;top:0;left:0;right:0;height:40px;padding:0 16px;display:flex;align-items:center;background:#fff;font-size:11px}
.sister-works-bar a{color:inherit;text-decoration:none}
.sister-main{width:100%!important;max-width:none!important;margin:0!important;padding:40px 16px 48px!important}
.sister-header{position:fixed;z-index:101;top:0;right:16px;width:auto;height:40px;margin:0;display:flex;align-items:center;background:#fff;font-size:11px;white-space:nowrap}
.sister-title{margin:0;font-size:11px;font-weight:400;line-height:1}
.sister-meta-corner{position:fixed;z-index:90;right:15px;bottom:12px;text-align:right;font-size:9px;line-height:1.45;opacity:.32}
.sister-meta-corner:hover{opacity:.72}
.sister-meta-corner a{color:inherit;text-decoration:none}
.sister-intro{display:none}
.sister-viewer{width:min(90vw,1200px)!important;max-width:none!important;margin:0 auto!important}
.sister-image-link{display:block;width:100%}
.sister-image{display:block;width:100%!important;max-width:none!important;max-height:none!important;height:auto!important}
.sister-caption-row,.sister-pair,.sister-count,.sister-detail-meta,.sister-collection{width:100%}
.sister-archive{width:min(72vw,760px);margin:52px auto 0}
@media(max-width:700px){
 .sister-works-bar{height:38px;padding:0 11px}
 .sister-main{padding:38px 11px 38px!important}
 .sister-header{right:11px;height:38px}
 .sister-meta-corner{right:10px;bottom:8px;font-size:8px}
 .sister-viewer,.sister-archive{width:100%!important}
}
</style>
</head>
<body>
  <div class="site">
    <header class="sister-works-bar"><a href="/">← works</a></header>

    <main class="main sister-main">
      <div class="sister-header">
        <h1 class="sister-title">sister</h1>
      </div>

      <div class="sister-meta-corner">
        <div>october 2022 — <a href="https://bureau-inc.com/exhibitions/sister" target="_blank" rel="noopener">bureau, new york</a></div>
        <div>pen and charcoal on paper, 48 × 32 in.</div>
      </div>

      <div class="sister-viewer">
        <a class="sister-image-link" href="#" aria-label="next drawing">
          <img class="sister-image" id="sister-image" src="the-marriage.jpg" alt="the marriage">
        </a>
        <div class="sister-caption-row">
          <div class="sister-caption" id="sister-caption">the marriage</div>
          <button class="sister-detail-toggle" id="sister-detail-toggle" type="button">details +</button>
        </div>
        <div class="sister-pair" id="sister-pair"><span>the marriage</span> ↔ <span class="inactive">the mother</span></div>
        <div class="sister-count" id="sister-count">1 / 8</div>
        <div class="sister-detail-meta" id="sister-detail-meta" hidden></div>
        <div class="sister-collection" id="sister-collection"></div>
      </div>

      <footer class="sister-archive">
        <div class="sister-archive-row"><span class="sister-archive-label">exhibition</span><a href="https://bureau-inc.com/exhibitions/sister" target="_blank" rel="noopener">bureau</a></div>
        <div class="sister-archive-row">
          <span class="sister-archive-label">press / features</span>
          <span class="sister-links">
            <a href="https://assets.ctfassets.net/hp42m99tzs4o/1l8mv91WMJ3Y15TLao8Bz0/5cab16f4ea936802fb0e9ebff2a82598/KM.2022.12_ArtinAmerica.caption.pdf" target="_blank" rel="noopener">art in america</a>
            <a href="https://hyperallergic.com/780238/expressionism-turned-inside-out/" target="_blank" rel="noopener">hyperallergic</a>
            <a href="https://downloads.ctfassets.net/hp42m99tzs4o/6c7OmX9By7qLxiRGwUG0eE/a7509dd4a51c96700657d2c02df694ee/KM.2022.12_TheAmp.caption.pdf" target="_blank" rel="noopener">the amp</a>
            <a href="https://www.contemporaryartdaily.com/project/kyung-me-at-bureau-new-york-26026" target="_blank" rel="noopener">contemporary art daily</a>
            <a href="https://artviewer.org/kyung-me-at-bureau/" target="_blank" rel="noopener">art viewer</a>
            <a href="http://the-editorialmagazine.com/kyung-me-sister/" target="_blank" rel="noopener">the editorial magazine</a>
          </span>
        </div>
      </footer>
    </main>
  </div>

<script>
const sisterSlides = [
  {
    src:"the-marriage.jpg", title:"the marriage", pair:["the marriage","the mother"], collection:"baltimore museum of art",
    details:["marriage-detail-1.jpg","marriage-detail-2.jpg","marriage-detail-3.jpg"]
  },
  {
    src:"the-mother.jpg", title:"the mother", pair:["the marriage","the mother"], collection:"baltimore museum of art",
    details:["mother-detail-1.jpg","mother-detail-2.jpg","mother-detail-3.jpg","mother-detail-4.jpg"]
  },
  {
    src:"the-prostration.jpg", title:"the prostration", pair:["the prostration","the resurrection"], collection:"whitney museum of american art", collectionUrl:"https://whitney.org/collection/works/68060",
    details:["prostration-detail-1.jpg","prostration-detail-2.jpg","prostration-detail-3.jpg"]
  },
  {
    src:"the-resurrection.jpg", title:"the resurrection", pair:["the prostration","the resurrection"],
    details:["resurrection-detail-1.jpg","resurrection-detail-2.jpg","resurrection-detail-3.jpg","resurrection-detail-4.jpg"]
  },
  {
    src:"the-confession.jpg", title:"the confession", pair:["the confession","the profession"],
    details:["confession-detail-1.jpg","confession-detail-2.jpg","confession-detail-3.jpg"]
  },
  {
    src:"the-profession.jpg", title:"the profession", pair:["the confession","the profession"],
    details:["profession-detail-1.jpg","profession-detail-2.jpg"]
  },
  {
    src:"the-vessel.jpg", title:"the vessel", pair:["the organ","the vessel"],
    details:["vessel-detail-1.jpg"]
  },
  {
    src:"the-organ.jpg", title:"the organ", pair:["the organ","the vessel"],
    details:["organ-detail-1.jpg","organ-detail-2.jpg"]
  }
];

let sisterIndex = 0;
let detailMode = false;
let detailIndex = 0;
let fullImageDisplayWidth = null;

const sisterViewer = document.querySelector(".sister-viewer");
const sisterImage = document.getElementById("sister-image");
const sisterCaption = document.getElementById("sister-caption");
const sisterPair = document.getElementById("sister-pair");
const sisterCount = document.getElementById("sister-count");
const sisterDetailMeta = document.getElementById("sister-detail-meta");
const sisterDetailToggle = document.getElementById("sister-detail-toggle");
const sisterCollection = document.getElementById("sister-collection");
const sisterLink = document.querySelector(".sister-image-link");

function renderPair(slide){
  const aActive = slide.title === slide.pair[0];
  sisterPair.innerHTML =
    `<span class="${aActive ? "" : "inactive"}">${slide.pair[0]}</span> ↔ ` +
    `<span class="${aActive ? "inactive" : ""}">${slide.pair[1]}</span>`;
}

function renderFull(){
  detailMode = false;
  detailIndex = 0;
  const slide = sisterSlides[sisterIndex];

  sisterViewer.classList.remove("detail-mode");
  sisterLink.style.width = "";
  sisterImage.style.width = "";
  fullImageDisplayWidth = null;
  sisterImage.src = slide.src;
  sisterImage.alt = slide.title;
  sisterCaption.textContent = slide.title;
  sisterCount.textContent = `${sisterIndex + 1} / ${sisterSlides.length}`;
  sisterDetailToggle.textContent = slide.details.length ? "details +" : "";
  sisterDetailToggle.hidden = !slide.details.length;
  sisterDetailMeta.hidden = true;
  sisterDetailMeta.textContent = "";
  if (slide.collection) {
    sisterCollection.innerHTML = slide.collectionUrl
      ? `<a href="${slide.collectionUrl}" target="_blank" rel="noopener">${slide.collection}</a>`
      : slide.collection;
  } else {
    sisterCollection.textContent = "";
  }
  renderPair(slide);
}

function renderDetail(){
  const slide = sisterSlides[sisterIndex];
  if (!slide.details.length) return;

  if (!detailMode) {
    fullImageDisplayWidth = sisterImage.getBoundingClientRect().width;
  }

  detailMode = true;
  sisterViewer.classList.add("detail-mode");
  if (fullImageDisplayWidth) {
    sisterLink.style.width = `${fullImageDisplayWidth}px`;
    sisterImage.style.width = `${fullImageDisplayWidth}px`;
  }
  sisterImage.src = slide.details[detailIndex];
  sisterImage.alt = `${slide.title}, detail ${detailIndex + 1}`;
  sisterCaption.textContent = slide.title;
  sisterCount.textContent = `${sisterIndex + 1} / ${sisterSlides.length}`;
  sisterDetailToggle.hidden = false;
  sisterDetailToggle.textContent = "full image";
  sisterDetailMeta.hidden = false;
  sisterDetailMeta.textContent = `detail ${detailIndex + 1} / ${slide.details.length}`;
  if (slide.collection) {
    sisterCollection.innerHTML = slide.collectionUrl
      ? `<a href="${slide.collectionUrl}" target="_blank" rel="noopener">${slide.collection}</a>`
      : slide.collection;
  } else {
    sisterCollection.textContent = "";
  }
  renderPair(slide);
}

function nextWork(delta){
  sisterIndex = (sisterIndex + delta + sisterSlides.length) % sisterSlides.length;
  renderFull();
}

function nextDetail(delta){
  const details = sisterSlides[sisterIndex].details;
  detailIndex = (detailIndex + delta + details.length) % details.length;
  renderDetail();
}

sisterLink.addEventListener("click", e => {
  e.preventDefault();
  if (detailMode) nextDetail(1);
  else nextWork(1);
});

sisterDetailToggle.addEventListener("click", () => {
  if (detailMode) renderFull();
  else {
    detailIndex = 0;
    renderDetail();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") {
    e.preventDefault();
    if (detailMode) nextDetail(1);
    else nextWork(1);
  }
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    if (detailMode) nextDetail(-1);
    else nextWork(-1);
  }
  if (e.key === "Escape" && detailMode) {
    renderFull();
  }
});

renderFull();
</script>
</body>
</html>
