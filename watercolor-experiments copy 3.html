const menu=document.querySelector('.mobile-menu-button');
menu.addEventListener('click',()=>{const open=document.querySelector('.sidebar').classList.toggle('menu-open');menu.setAttribute('aria-expanded',String(open));menu.textContent=open?'works −':'works +';});
const paths=["watercolor%20experiments/j0004%20copy.jpg", "watercolor%20experiments/j0005%20copy.jpg", "watercolor%20experiments/j0008%20copy.jpg", "watercolor%20experiments/j0009%20copy.jpg", "watercolor%20experiments/j0012%20copy.jpg", "watercolor%20experiments/j0002%20copy%202.jpg", "watercolor%20experiments/j0010%20copy.jpg", "watercolor%20experiments/j0011%20copy.jpg", "watercolor%20experiments/j0015%20copy.jpg", "watercolor%20experiments/j0016%20copy.jpg", "watercolor%20experiments/j0017%20copy.jpg", "watercolor%20experiments/j0018.jpg", "watercolor%20experiments/j0020%20copy.jpg", "watercolor%20experiments/j0026.jpg", "watercolor%20experiments/j0006%20copy.jpg", "watercolor%20experiments/j0021%20copy.jpg"];
const dialog=document.querySelector('.viewer'),image=dialog.querySelector('img'),counter=dialog.querySelector('.viewer-count');
const cache=new Map();let current=0,token=0,trigger=null,oldOverflow='';
function load(i){if(!cache.has(i))cache.set(i,new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{(img.decode?img.decode():Promise.resolve()).catch(()=>{}).then(()=>resolve(img));};img.onerror=()=>{cache.delete(i);reject(new Error('Image unavailable'));};img.src=paths[i];}));return cache.get(i);}
async function show(i){current=(i+paths.length)%paths.length;const ix=current,request=++token;try{const ready=await load(ix);if(request!==token||!dialog.open)return;image.src=ready.src;image.alt='Watercolor study '+(ix+1);counter.textContent=(ix+1)+' / '+paths.length;load((ix+1)%paths.length).catch(()=>{});load((ix+paths.length-1)%paths.length).catch(()=>{});}catch(e){if(request===token)counter.textContent='Image unavailable';}}
document.querySelectorAll('.study').forEach(button=>{button.addEventListener('click',()=>{trigger=button;oldOverflow=document.body.style.overflow;document.body.style.overflow='hidden';dialog.showModal();show(Number(button.dataset.index));});button.addEventListener('pointerenter',()=>load(Number(button.dataset.index)).catch(()=>{}),{once:true});});
dialog.querySelector('.viewer-close').addEventListener('click',()=>dialog.close());
dialog.querySelector('.viewer-prev').addEventListener('click',()=>show(current-1));
dialog.querySelector('.viewer-next').addEventListener('click',()=>show(current+1));image.addEventListener('click',()=>show(current+1));
dialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1);}});
dialog.addEventListener('close',()=>{token++;document.body.style.overflow=oldOverflow;image.removeAttribute('src');counter.textContent='';trigger?.focus({preventScroll:true});});
