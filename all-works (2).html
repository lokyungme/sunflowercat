<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wander — kyung-me</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.top{position:fixed;z-index:100;top:0;left:0;right:0;height:20px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;background:#fff;font-size:11px}
.trail{padding:105px 4vw 34vh}
.work{display:block;width:var(--w);margin:0 0 var(--gap) var(--x);position:relative}
.work img{display:block;width:100%;max-height:78vh;object-fit:contain;object-position:center}
.label{position:absolute;top:calc(100% + 6px);left:0;font-size:10px;line-height:1.2;opacity:0;transition:opacity .15s ease}
.work:hover .label,.work:focus-visible .label{opacity:1}
.year{margin-left:7px;color:#999}
.hint{position:fixed;z-index:80;left:10px;bottom:8px;font-size:9px;color:#bbb;pointer-events:none}
@media(max-width:700px){
 .top{padding:0 8px}
 .trail{padding:72px 12px 24vh}
 .work{width:var(--mw);margin-left:var(--mx);margin-bottom:72px}
 .work img{max-height:none}
 .label{position:static;display:flex;justify-content:space-between;margin-top:5px;font-size:9px;opacity:1}
 .hint{display:none}
}
</style>
</head>
<body>
<header class="top"><a href="/">← home</a><span>wander</span></header>
<main class="trail" id="trail">
 <a class="work" href="sunflower" style="--w:54vw;--x:7vw;--gap:24vh;--mw:94%;--mx:0"><img src="i-sunflower-install/02.jpg" alt="i, sunflower"><span class="label">i, sunflower <span class="year">2026</span></span></a>
 <a class="work" href="half-mourning" style="--w:37vw;--x:54vw;--gap:31vh;--mw:73%;--mx:25%"><img src="Half%20Mourning/half-mourning-1.jpg" alt="half mourning"><span class="label">half mourning <span class="year">2018</span></span></a>
 <a class="work" href="more-ink-drawings" style="--w:42vw;--x:18vw;--gap:27vh;--mw:82%;--mx:5%"><img src="more%20ink%20drawings/01_The%20House%20Cat.jpg" alt="more ink drawings"><span class="label">more ink drawings <span class="year">2024</span></span></a>
 <a class="work" href="copy-kitty" style="--w:25vw;--x:65vw;--gap:33vh;--mw:58%;--mx:40%"><img src="copy%20kitty/copy-kitty-cover-front.png" alt="copy kitty"><span class="label">copy kitty <span class="year">2017</span></span></a>
 <a class="work" href="house-in-the-trees" style="--w:58vw;--x:3vw;--gap:23vh;--mw:96%;--mx:0"><img src="House%20in%20the%20trees/01_The%20Mask.jpg" alt="the house in the trees"><span class="label">the house in the trees <span class="year">2023</span></span></a>
 <a class="work" href="labyrinths" style="--w:32vw;--x:57vw;--gap:29vh;--mw:68%;--mx:28%"><img src="Labyrinths/rc_fullsize.jpg" alt="labyrinths"><span class="label">labyrinths <span class="year">2015</span></span></a>
 <a class="work" href="pkan" style="--w:29vw;--x:15vw;--gap:34vh;--mw:62%;--mx:3%"><img src="sunflower-cover.jpg" alt="paintings for pkan"><span class="label">paintings for pkan <span class="year">2026</span></span></a>
 <a class="work" href="sister" style="--w:49vw;--x:43vw;--gap:25vh;--mw:90%;--mx:8%"><img src="sister/the-marriage.jpg" alt="sister"><span class="label">sister <span class="year">2022</span></span></a>
 <a class="work" href="bad-korean" style="--w:22vw;--x:8vw;--gap:31vh;--mw:52%;--mx:2%"><img src="bad-korean/00_front-cover.jpg" alt="bad korean"><span class="label">bad korean <span class="year">2014</span></span></a>
 <a class="work" href="coniunctio" style="--w:45vw;--x:47vw;--gap:28vh;--mw:86%;--mx:12%"><img src="Coniunctio/01.jpg" alt="coniunctio"><span class="label">coniunctio <span class="year">2019</span></span></a>
 <a class="work" href="ghost" style="--w:38vw;--x:13vw;--gap:30vh;--mw:72%;--mx:0"><img src="Ghost/ghost%201.jpg" alt="ghost"><span class="label">ghost <span class="year">2016</span></span></a>
 <a class="work" href="commissions" style="--w:51vw;--x:39vw;--gap:26vh;--mw:92%;--mx:6%"><img src="Commissions/Hyundai.jpg" alt="commissions"><span class="label">commissions <span class="year">2022–2025</span></span></a>
</main>
<div class="hint">follow the images · hover for titles</div>
<script>
const trail=document.getElementById('trail');
const original=[...trail.children];
let appended=false;
function extendTrail(){
 if(appended||document.documentElement.scrollHeight-innerHeight-scrollY>innerHeight*2)return;
 appended=true;
 original.forEach(work=>trail.appendChild(work.cloneNode(true)));
}
addEventListener('scroll',extendTrail,{passive:true});
</script>
</body>
</html>
