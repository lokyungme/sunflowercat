<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sister — kyung-me</title>
<link rel="stylesheet" href="style.css">
<style>
html,body{height:auto!important;min-height:100%;overflow-x:hidden!important;overflow-y:auto!important}
.site{display:block!important;min-height:100vh}
.sister-works-bar{position:fixed;z-index:100;top:0;left:0;right:0;height:20px;padding:0 10px;display:flex;align-items:center;background:#fff;font-size:11px}
.sister-works-bar a{color:inherit;text-decoration:none}
.sister-main{width:100%!important;max-width:none!important;margin:0!important;padding:20px 16px 48px!important}
.sister-header{position:fixed;z-index:101;top:0;right:10px;width:auto;height:20px;margin:0;display:flex;align-items:center;background:#fff;font-size:11px;white-space:nowrap}
.sister-title{margin:0;font-size:11px;font-weight:400;line-height:1}
.sister-title a{color:inherit;text-decoration:none}
.sister-meta-corner{position:fixed;z-index:90;right:15px;bottom:12px;text-align:right;font-size:9px;line-height:1.45;opacity:.32}
.sister-meta-corner:hover{opacity:.72}
.sister-meta-corner a{color:inherit;text-decoration:none}
.sister-intro{display:none}
.sister-viewer{width:min(90vw,1200px)!important;max-width:none!important;margin:0 auto!important}
.sister-viewer{transition:transform .48s cubic-bezier(.4,0,.2,1),opacity .42s ease;transform-origin:88% 88%}
.sister-image-link{display:block;width:100%}
.sister-image{display:block;width:100%!important;max-width:none!important;max-height:none!important;height:auto!important}
.sister-caption-row,.sister-detail-meta,.sister-collection{width:100%}
.sister-archive{width:min(72vw,760px);margin:52px auto 0}
.sister-stamp-home{position:fixed;z-index:110;right:6vw;bottom:108px;width:86px;height:86px;display:block;border:0;padding:0;background:transparent;cursor:pointer}
.sister-stamp-home img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .2s ease}
.sister-stamp-home:hover img{transform:rotate(-3deg) scale(1.03)}
.sister-stamp-home::after{content:'';position:absolute;inset:0;background:url('https://media.cargocollective.com/1/10/322251/headerimg/light-stamp-180-copy.png') center/contain no-repeat;opacity:0;pointer-events:none}
body.stamp-leaving .sister-viewer{transform:scale(.72) translate(24%,18%);opacity:0}
body.stamp-leaving .sister-stamp-home img{animation:stampPress .48s ease forwards}
body.stamp-leaving .sister-stamp-home::after{animation:stampEcho .55s ease forwards}
@keyframes stampPress{0%{transform:scale(1)}35%{transform:scale(.82)}100%{transform:scale(1.06)}}
@keyframes stampEcho{0%{opacity:.28;transform:scale(.8)}100%{opacity:0;transform:scale(4.2)}}
@media(max-width:700px){
 .sister-works-bar{height:20px;padding:0 8px}
 .sister-main{padding:20px 11px 38px!important}
 .sister-header{right:8px;height:20px}
 .sister-meta-corner{right:10px;bottom:8px;font-size:8px}
 .sister-viewer,.sister-archive{width:100%!important}
 .sister-stamp-home{right:15px;bottom:52px;width:55px;height:55px}
}
@media(prefers-reduced-motion:reduce){.sister-viewer,.sister-stamp-home img{transition:none!important}.sister-stamp-home::after{display:none}}
</style>
</head>
<body>
  <div class="site">
    <header class="sister-works-bar"><a href="/">← works</a></header>

    <main class="main sister-main">
      <div class="sister-header">
        <h1 class="sister-title"><a href="https://bureau-inc.com/exhibitions/sister" target="_blank" rel="noopener">sister</a></h1>
      </div>

      <div class="sister-meta-corner">
        <div>pen and charcoal on paper, 48 × 32 in.</div>
      </div>

      <div class="sister-viewer">
        <a class="sister-image-link" href="#" aria-label="next drawing">
          <img class="sister-image" id="sister-image" src="sister/the-marriage.jpg" alt="the marriage">
        </a>
        <div class="sister-caption-row">
          <div class="sister-caption" id="sister-caption">the marriage</div>
          <button class="sister-detail-toggle" id="sister-detail-toggle" type="button">details +</button>
        </div>
        <div class="sister-detail-meta" id="sister-detail-meta" hidden></div>
        <div class="sister-collection" id="sister-collection"></div>
      </div>

      <footer class="sister-archive">
        <div class="sister-archive-row"><span class="sister-archive-label">exhibition</span><a href="https://bureau-inc.com/exhibitions/sister" target="_blank" rel="noopener">bureau</a></div>
        <div class="sister-archive-row">
          <span class="sister-archive-label">press / features</span>
          <span class="sister-links">
            <a href="https://assets.ctfassets.net/hp42m99tzs4o/1l8mv91WMJ3Y15TLao8Bz0/5cab16f4ea936802fb0e9ebff2a82598/KM.2022.12_ArtinAmerica.caption.pdf" target="_blank" rel="noopener">art in america</a>
            <a href="https://hyperallergic.com/780238/expressionism-turned-inside-out/" target="_blank" rel="noopener">hyperallergic</a>
            <a href="https://downloads.ctfassets.net/hp42m99tzs4o/6c7OmX9By7qLxiRGwUG0eE/a7509dd4a51c96700657d2c02df694ee/KM.2022.12_TheAmp.caption.pdf" target="_blank" rel="noopener">the amp</a>
            <a href="https://www.contemporaryartdaily.com/project/kyung-me-at-bureau-new-york-26026" target="_blank" rel="noopener">contemporary art daily</a>
            <a href="https://artviewer.org/kyung-me-at-bureau/" target="_blank" rel="noopener">art viewer</a>
            <a href="http://the-editorialmagazine.com/kyung-me-sister/" target="_blank" rel="noopener">the editorial magazine</a>
          </span>
        </div>
      </footer>
    </main>
    <a class="sister-stamp-home" id="sister-stamp-home" href="/" aria-label="return home" title="home">
      <img src="https://media.cargocollective.com/1/10/322251/headerimg/light-stamp-180-copy.png" alt="">
    </a>
  </div>

<script>
const sisterSlides = [
  {
    src:"sister/the-marriage.jpg", title:"the marriage", pair:["the marriage","the mother"], collection:"baltimore museum of art",
    details:["sister/marriage-detail-1.jpg","sister/marriage-detail-2.jpg","sister/marriage-detail-3.jpg"]
  },
  {
    src:"sister/the-mother.jpg", title:"the mother", pair:["the marriage","the mother"], collection:"baltimore museum of art",
    details:["sister/mother-detail-1.jpg","sister/mother-detail-2.jpg","sister/mother-detail-3.jpg","sister/mother-detail-4.jpg"]
  },
  {
    src:"sister/the-prostration.jpg", title:"the prostration", pair:["the prostration","the resurrection"], collection:"whitney museum of american art", collectionUrl:"https://whitney.org/collection/works/68060",
    details:["sister/prostration-detail-1.jpg","sister/prostration-detail-2.jpg","sister/prostration-detail-3.jpg"]
  },
  {
    src:"sister/the-resurrection.jpg", title:"the resurrection", pair:["the prostration","the resurrection"],
    details:["sister/resurrection-detail-1.jpg","sister/resurrection-detail-2.jpg","sister/resurrection-detail-3.jpg","sister/resurrection-detail-4.jpg"]
  },
  {
    src:"sister/the-confession.jpg", title:"the confession", pair:["the confession","the profession"],
    details:["sister/confession-detail-1.jpg","sister/confession-detail-2.jpg","sister/confession-detail-3.jpg"]
  },
  {
    src:"sister/the-profession.jpg", title:"the profession", pair:["the confession","the profession"],
    details:["sister/profession-detail-1.jpg","sister/profession-detail-2.jpg"]
  },
  {
    src:"sister/the-vessel.jpg", title:"the vessel", pair:["the organ","the vessel"],
    details:["sister/vessel-detail-1.jpg"]
  },
  {
    src:"sister/the-organ.jpg", title:"the organ", pair:["the organ","the vessel"],
    details:["sister/organ-detail-1.jpg","sister/organ-detail-2.jpg"]
  }
];

let sisterIndex = 0;
let detailMode = false;
let detailIndex = 0;
let fullImageDisplayWidth = null;

const sisterViewer = document.querySelector(".sister-viewer");
const sisterImage = document.getElementById("sister-image");
const sisterCaption = document.getElementById("sister-caption");
const sisterDetailMeta = document.getElementById("sister-detail-meta");
const sisterDetailToggle = document.getElementById("sister-detail-toggle");
const sisterCollection = document.getElementById("sister-collection");
const sisterLink = document.querySelector(".sister-image-link");

function renderFull(){
  detailMode = false;
  detailIndex = 0;
  const slide = sisterSlides[sisterIndex];

  sisterViewer.classList.remove("detail-mode");
  sisterLink.style.width = "";
  sisterImage.style.width = "";
  fullImageDisplayWidth = null;
  sisterImage.src = slide.src;
  sisterImage.alt = slide.title;
  sisterCaption.textContent = slide.title;
  sisterDetailToggle.textContent = slide.details.length ? "details +" : "";
  sisterDetailToggle.hidden = !slide.details.length;
  sisterDetailMeta.hidden = true;
  sisterDetailMeta.textContent = "";
  if (slide.collection) {
    sisterCollection.innerHTML = slide.collectionUrl
      ? `<a href="${slide.collectionUrl}" target="_blank" rel="noopener">${slide.collection}</a>`
      : slide.collection;
  } else {
    sisterCollection.textContent = "";
  }
}

function renderDetail(){
  const slide = sisterSlides[sisterIndex];
  if (!slide.details.length) return;

  if (!detailMode) {
    fullImageDisplayWidth = sisterImage.getBoundingClientRect().width;
  }

  detailMode = true;
  sisterViewer.classList.add("detail-mode");
  if (fullImageDisplayWidth) {
    sisterLink.style.width = `${fullImageDisplayWidth}px`;
    sisterImage.style.width = `${fullImageDisplayWidth}px`;
  }
  sisterImage.src = slide.details[detailIndex];
  sisterImage.alt = `${slide.title}, detail ${detailIndex + 1}`;
  sisterCaption.textContent = slide.title;
  sisterDetailToggle.hidden = false;
  sisterDetailToggle.textContent = "full image";
  sisterDetailMeta.hidden = false;
  sisterDetailMeta.textContent = `detail ${detailIndex + 1} / ${slide.details.length}`;
  if (slide.collection) {
    sisterCollection.innerHTML = slide.collectionUrl
      ? `<a href="${slide.collectionUrl}" target="_blank" rel="noopener">${slide.collection}</a>`
      : slide.collection;
  } else {
    sisterCollection.textContent = "";
  }
}

function nextWork(delta){
  sisterIndex = (sisterIndex + delta + sisterSlides.length) % sisterSlides.length;
  renderFull();
}

function nextDetail(delta){
  const details = sisterSlides[sisterIndex].details;
  detailIndex = (detailIndex + delta + details.length) % details.length;
  renderDetail();
}

sisterLink.addEventListener("click", e => {
  e.preventDefault();
  if (detailMode) nextDetail(1);
  else nextWork(1);
});

sisterDetailToggle.addEventListener("click", () => {
  if (detailMode) renderFull();
  else {
    detailIndex = 0;
    renderDetail();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") {
    e.preventDefault();
    if (detailMode) nextDetail(1);
    else nextWork(1);
  }
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    if (detailMode) nextDetail(-1);
    else nextWork(-1);
  }
  if (e.key === "Escape" && detailMode) {
    renderFull();
  }
});

renderFull();

document.getElementById("sister-stamp-home").addEventListener("click", e => {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  e.preventDefault();
  document.body.classList.add("stamp-leaving");
  window.setTimeout(() => { window.location.href = "/"; }, 480);
});
</script>
</body>
</html>
