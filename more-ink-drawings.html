<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.top{position:fixed;z-index:40;top:0;left:270px;right:0;height:20px;padding:0 16px;display:flex;align-items:center;justify-content:flex-end;background:#fff;font-size:11px}
.viewer{position:absolute;inset:20px 0 0 270px;background:#fff}
.art{position:absolute;top:0;left:50%;transform:translateX(-50%);display:block;max-width:calc(100vw - 286px);max-height:calc(100vh - 20px);width:auto;height:auto;opacity:0;transition:opacity 80ms linear;user-select:none;-webkit-user-drag:none}
.art.active{opacity:1}
.zone{position:fixed;z-index:30;top:20px;bottom:0;width:calc((100% - 270px)/2);border:0;background:transparent;padding:0;cursor:pointer}
.prev{left:270px;cursor:w-resize}.next{right:0;cursor:e-resize}
.arrow{position:fixed;z-index:35;top:50%;transform:translateY(-50%);font-size:14px;opacity:.14;pointer-events:none}
.arrow.left{left:282px}.arrow.right{right:12px}
.counter{position:fixed;z-index:45;left:calc(50% + 135px);bottom:10px;transform:translateX(-50%);font-size:9px;opacity:.3;letter-spacing:.04em;pointer-events:none}
@media(max-width:700px){
 .top{left:148px;padding:0 11px}
 .viewer{inset:20px 0 0 148px}
 .art{max-width:calc(100vw - 156px);max-height:calc(100svh - 20px)}
 .zone{width:calc((100% - 148px)/2)}.prev{left:148px}
 .arrow.left{left:156px}
 .counter{left:calc(50% + 74px)}
}
@media(prefers-reduced-motion:reduce){.art{transition:none}}

.sidebar{position:fixed;z-index:110;inset:0 auto 0 0;width:270px;padding:22px 22px 28px;background:#fff;display:flex;flex-direction:column;overflow-y:auto}.name{margin:0 0 30px;width:72px;font-size:0;line-height:0}.name a,.stamp{display:block;width:100%;height:auto}.projects{display:flex;flex-direction:column;align-items:stretch;gap:11px}.projects a{display:grid;grid-template-columns:43px minmax(0,1fr);width:auto;font-size:12px;font-weight:400;line-height:1.25;letter-spacing:0;text-transform:none}.project-year{color:#999;font-size:10px;line-height:1.5}.projects a:hover .project-name{text-decoration:underline;text-underline-offset:3px}.menu-secondary{display:flex;flex-direction:row;align-items:center;gap:12px;margin-top:auto;padding-top:42px}.menu-secondary a{color:#999;font-size:10px;font-weight:400;line-height:1.25;letter-spacing:0;text-transform:none}.menu-secondary a:hover{text-decoration:underline;text-underline-offset:3px}.side-top{margin:0 0 22px}.studio-note{display:grid;grid-template-columns:43px minmax(0,1fr);align-items:baseline;margin:0;max-width:none;font-size:12px;font-weight:400;line-height:1.25;color:#111;letter-spacing:0;text-transform:none}.studio-now{color:#999;font-size:10px;line-height:1.5}.studio-note a:hover{text-decoration:underline;text-underline-offset:3px}
@media(max-width:700px){.sidebar{width:148px;padding:16px 13px 22px}.name{width:58px;margin-bottom:24px}.projects{gap:10px}.projects a{display:block;font-size:12px}.project-year{display:block;font-size:10px;margin-bottom:1px}.menu-secondary{gap:9px;margin-top:auto;padding-top:32px}.menu-secondary a{font-size:9px}.side-top{margin-bottom:20px}}

<header class="top">
 <div>more ink drawings</div>
</header>
<main class="viewer">
 <img id="art-a" class="art active" src="more%20ink%20drawings/01_The%20House%20Cat.jpg" alt="The House Cat" aria-hidden="false">
 <img id="art-b" class="art" src="" alt="" aria-hidden="true">
</main>
<button class="zone prev" id="prev" aria-label="previous image"></button>
<button class="zone next" id="next" aria-label="next image"></button>
<div class="arrow left">←</div><div class="arrow right">→</div>
<div class="counter" id="counter">1 / 10</div>
<script>
const works=[
 ['more%20ink%20drawings/01_The%20House%20Cat.jpg','The House Cat'],
 ['more%20ink%20drawings/02_The%20Study.jpg','The Study'],
 ['more%20ink%20drawings/03_the%20dollhouse.jpg','The Dollhouse'],
 ['more%20ink%20drawings/04_the%20vault.jpg','The Vault'],
 ['more%20ink%20drawings/05_mary.jpg','Mary'],
 ['more%20ink%20drawings/06_the%20monarch.jpg','The Monarch'],
 ['more%20ink%20drawings/07_the%20guest.jpg','The Guest'],
 ['more%20ink%20drawings/08_The%20Clock.jpg','The Clock'],
 ['more%20ink%20drawings/09_The%20Hunt.jpg','The Hunt'],
 ['more%20ink%20drawings/010_The%20Actor.jpg','The Actor']
];
let i=0,transitionToken=0;
let front=document.getElementById('art-a'),back=document.getElementById('art-b');
const counter=document.getElementById('counter');
works.forEach(work=>{const image=new Image();image.src=work[0]});
function show(n){
 i=(n+works.length)%works.length;
 const work=works[i],token=++transitionToken;
 back.onload=()=>{
  if(token!==transitionToken)return;
  back.alt=work[1];
  back.setAttribute('aria-hidden','false');
  front.setAttribute('aria-hidden','true');
  back.classList.add('active');
  front.classList.remove('active');
  [front,back]=[back,front];
  counter.textContent=(i+1)+' / '+works.length;
 };
 back.src=work[0];
}
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',event=>{
 if(event.key==='ArrowRight')show(i+1);
 if(event.key==='ArrowLeft')show(i-1);
});
</script>
