<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>copy kitty — kyung-me</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
a{color:inherit;text-decoration:none}
.topbar{position:fixed;z-index:20;top:0;left:270px;right:0;height:24px;display:flex;align-items:center;justify-content:flex-end;padding:0 10px;font-size:11px;background:#fff}
.meta{display:flex;gap:17px}
.stage{position:fixed;inset:24px 0 0 270px;display:flex;align-items:flex-start;justify-content:center;padding:0 0 18px;background:#fff}
.page-button{border:0;background:none;padding:0;display:flex;align-items:flex-start;justify-content:center;cursor:e-resize;max-width:100%;max-height:100%}
.page-image{display:block;max-width:calc(100vw - 270px);max-height:calc(100vh - 42px);width:auto;height:auto;object-fit:contain;box-shadow:0 12px 34px rgba(0,0,0,.045)}
@media(max-width:700px){.topbar{left:148px;height:22px;padding:0 8px}.meta{gap:11px}.stage{inset:22px 0 0 148px;padding:0 0 14px}.page-image{max-width:calc(100vw - 148px);max-height:calc(100vh - 36px)}}
.page-nav{
 position:fixed;z-index:30;top:50%;transform:translateY(-50%);
 border:0;background:transparent;color:#111;font:inherit;font-size:18px;
 padding:22px 15px;cursor:pointer;opacity:.22;transition:opacity .15s ease
}
.page-nav:hover{opacity:.9}
.page-prev{left:275px}.page-next{right:5px}
@media(max-width:700px){.page-nav{font-size:16px;padding:18px 8px}.page-prev{left:148px}.page-next{right:0}}

.page-image{
  transition:transform .28s ease, opacity .28s ease;
}
.page-image.slide-left{
  transform:translateX(-70px);
  opacity:0;
}
.page-image.slide-right{
  transform:translateX(70px);
  opacity:0;
}
.page-image.enter-from-right{
  animation:ckEnterRight .28s ease;
}
.page-image.enter-from-left{
  animation:ckEnterLeft .28s ease;
}
@keyframes ckEnterRight{
  from{transform:translateX(70px);opacity:0}
  to{transform:translateX(0);opacity:1}
}
@keyframes ckEnterLeft{
  from{transform:translateX(-70px);opacity:0}
  to{transform:translateX(0);opacity:1}
}
.buy-book-link{
  position:fixed;
  right:18px;
  bottom:17px;
  z-index:80;
  font-size:10px;
  letter-spacing:.03em;
  color:#111;
  text-decoration:none;
  opacity:.34;
  transition:opacity .15s ease;
}
.buy-book-link:hover{
  opacity:1;
  text-decoration:underline;
  text-underline-offset:3px;
}
@media(max-width:700px){
  .buy-book-link{right:12px;bottom:12px;font-size:9px}
}
.sidebar{position:fixed;z-index:110;inset:0 auto 0 0;width:270px;padding:22px 22px 28px;background:#fff;display:flex;flex-direction:column;overflow-y:auto}
.name{margin:0 0 30px;width:72px;font-size:0;line-height:0}.name a,.stamp{display:block;width:100%;height:auto}
.projects{display:flex;flex-direction:column;align-items:stretch;gap:11px}.projects a{display:grid;grid-template-columns:43px minmax(0,1fr);width:auto;font-size:12px;font-weight:400;line-height:1.25;letter-spacing:0;text-transform:none}.project-year{color:#999;font-size:10px;line-height:1.5}.projects a:hover .project-name{text-decoration:underline;text-underline-offset:3px}
.menu-secondary{display:flex;flex-direction:row;align-items:center;gap:12px;margin-top:auto;padding-top:42px}.menu-secondary a{color:#999;font-size:10px;font-weight:400;line-height:1.25;letter-spacing:0;text-transform:none}.menu-secondary a:hover{text-decoration:underline;text-underline-offset:3px}
.side-top{margin:0 0 22px}.studio-note{display:grid;grid-template-columns:43px minmax(0,1fr);align-items:baseline;margin:0;max-width:none;font-size:12px;font-weight:400;line-height:1.25;color:#111;letter-spacing:0;text-transform:none}.studio-now{color:#999;font-size:10px;line-height:1.5}.studio-note a:hover{text-decoration:underline;text-underline-offset:3px}
@media(max-width:700px){.sidebar{width:148px;padding:16px 13px 22px}.name{width:58px;margin-bottom:24px}.projects{gap:10px}.projects a{display:block;font-size:12px}.project-year{display:block;font-size:10px;margin-bottom:1px}.menu-secondary{gap:9px;margin-top:auto;padding-top:32px}.menu-secondary a{font-size:9px}.side-top{margin-bottom:20px}}
</style>
</head>
<body>
<aside class="sidebar">
  <h1 class="name"><a href="index" aria-label="home"><img class="stamp" src="https://media.cargocollective.com/1/10/322251/headerimg/light-stamp-180-copy.png" alt="kyung-me stamp"></a></h1>
  <div class="side-top"><p class="studio-note"><span class="studio-now">now</span><a href="pkan">paintings for pkan</a></p></div>
  <nav class="projects" aria-label="projects">
    <a href="sunflower"><span class="project-year">2026</span><span class="project-name">i, sunflower</span></a>
    <a href="more-ink-drawings"><span class="project-year">2024</span><span class="project-name">more ink drawings</span></a>
    <a href="house-in-the-trees"><span class="project-year">2023</span><span class="project-name">the house in the trees</span></a>
    <a href="sister"><span class="project-year">2022</span><span class="project-name">sister</span></a>
    <a href="coniunctio"><span class="project-year">2019</span><span class="project-name">coniunctio</span></a>
    <a href="half-mourning"><span class="project-year">2018</span><span class="project-name">half mourning</span></a>
    <a href="copy-kitty"><span class="project-year">2017</span><span class="project-name">copy kitty</span></a>
    <a href="ghost"><span class="project-year">2016</span><span class="project-name">ghost</span></a>
    <a href="labyrinths"><span class="project-year">2015</span><span class="project-name">labyrinths</span></a>
    <a href="bad-korean"><span class="project-year">2014</span><span class="project-name">bad korean</span></a>
  </nav>
  <nav class="menu-secondary" aria-label="information pages"><a href="about">about</a><a href="teaching">teaching</a><a href="cv">cv</a></nav>
</aside>
<a class="buy-book-link" href="https://2dcloud.com/products/copy-kitty" target="_blank" rel="noopener">buy book</a>
<header class="topbar"><div class="meta"><span>copy kitty</span></div></header>
<button class="page-nav page-prev" id="page-prev" type="button" aria-label="previous page">←</button>
<button class="page-nav page-next" id="page-next" type="button" aria-label="next page">→</button>
<main class="stage">
  <button class="page-button" id="page-button" aria-label="next page"><img class="page-image" id="page-image" src="copy%20kitty/copy-kitty-cover-front.png" alt="Copy Kitty front cover"></button>
</main>
<script>
const pages=[
  {src:'copy%20kitty/copy-kitty-cover-front.png',alt:'Copy Kitty front cover'},
  ...Array.from({length:30},(_,i)=>i+1)
    .filter(n=>![18,19,20].includes(n))
    .map(n=>({src:`copy%20kitty/ck-${String(n).padStart(3,'0')}.jpg`,alt:`Copy Kitty drawing ${n}`})),
  {src:'copy%20kitty/copy-kitty-cover-back.png',alt:'Copy Kitty back cover'}
];

pages.forEach(page=>{
  const preloader = new Image();
  preloader.src = page.src;
});

let current=0;

const button=document.getElementById('page-button');
const image=document.getElementById('page-image');
const prevBtn=document.getElementById('page-prev');
const nextBtn=document.getElementById('page-next');

function render(){
  image.classList.remove('slide-left','slide-right','enter-from-right','enter-from-left');
  image.src=pages[current].src;
  image.alt=pages[current].alt;
}

function next(){
  current = (current+1)%pages.length;
  render();
}

function prev(){
  current = (current-1+pages.length)%pages.length;
  render();
}

button.addEventListener('click',next);
nextBtn.addEventListener('click',next);
prevBtn.addEventListener('click',prev);

// Trackpad / Magic Mouse horizontal navigation.
// Treat each gesture as one physical page turn: require a more deliberate
// swipe, then lock navigation until that gesture has fully settled.
let wheelAccum=0;
let wheelLocked=false;
let settleTimer=null;

document.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();

  clearTimeout(settleTimer);

  // Momentum events from the same swipe are ignored after one page turn.
  if(!wheelLocked){
    wheelAccum += e.deltaX;

    // Higher threshold gives the page a little resistance.
    if(Math.abs(wheelAccum) >= 115){
      wheelLocked=true;
      const dir = wheelAccum > 0 ? 1 : -1;
      wheelAccum=0;

      if(dir>0) next();
      else prev();
    }
  }

  // Only unlock after the trackpad/mouse gesture and its momentum stop.
  settleTimer=setTimeout(()=>{
    wheelLocked=false;
    wheelAccum=0;
  },320);
},{passive:false});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){
    e.preventDefault();
    next();
  }
  if(e.key==='ArrowLeft'){
    e.preventDefault();
    prev();
  }
});

render();
</script>
</body>
</html>
