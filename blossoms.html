</main><script>const button=document.querySelector('.mobile-menu-button');const sidebar=document.querySelector('.sidebar');button.addEventListener('click',()=>{const open=sidebar.classList.toggle('menu-open');button.setAttribute('aria-expanded',String(open));button.textContent=open?'works −':'works +';});
function measureOpening(){const strip=document.querySelector('main');document.documentElement.style.setProperty('--opening-height',strip.getBoundingClientRect().top+window.scrollY+'px');}
new ResizeObserver(measureOpening).observe(sidebar);
window.addEventListener('resize',measureOpening);
measureOpening();

const strip=document.querySelector('main');
let drag=null;
strip.addEventListener('pointerdown',event=>{
 if(event.pointerType!=='mouse'||event.button!==0)return;
 drag={id:event.pointerId,x:event.clientX,left:strip.scrollLeft};
 strip.classList.add('is-dragging');
 strip.setPointerCapture(event.pointerId);
 event.preventDefault();
});
strip.addEventListener('pointermove',event=>{
 if(!drag||event.pointerId!==drag.id)return;
 strip.scrollLeft=drag.left-(event.clientX-drag.x);
});
function endDrag(event){
 if(!drag||event.pointerId!==drag.id)return;
 drag=null;
 strip.classList.remove('is-dragging');
 if(strip.hasPointerCapture(event.pointerId))strip.releasePointerCapture(event.pointerId);
}
strip.addEventListener('pointerup',endDrag);
strip.addEventListener('pointercancel',endDrag);
strip.addEventListener('lostpointercapture',endDrag);
strip.addEventListener('dragstart',event=>event.preventDefault());
</script></body></html>
