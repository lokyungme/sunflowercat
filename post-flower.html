(()=>{
 const menu=document.querySelector('.mobile-menu-button'),sidebar=document.querySelector('.sidebar');
 menu.addEventListener('click',()=>{const open=sidebar.classList.toggle('menu-open');menu.setAttribute('aria-expanded',String(open));menu.textContent=open?'works −':'works +';});
 const works=[...document.querySelectorAll('.flower-item')],viewer=document.querySelector('.viewer'),image=viewer.querySelector('img'),count=viewer.querySelector('.viewer-count'),close=viewer.querySelector('.viewer-close');
 let index=0,previousFocus,previousOverflow='',request=0;
 function show(n){index=(n+works.length)%works.length;const src=works[index].querySelector('img');const ticket=++request;const next=new Image();next.onload=()=>{if(ticket!==request)return;image.src=next.src;image.alt=src.alt;count.textContent=(index+1)+' / '+works.length;};next.src=src.src;}
 function open(n){previousFocus=document.activeElement;previousOverflow=document.body.style.overflow;viewer.hidden=false;document.body.style.overflow='hidden';image.removeAttribute('src');count.textContent='';show(n);close.focus();}
 function dismiss(){request++;viewer.hidden=true;document.body.style.overflow=previousOverflow;previousFocus?.focus();}
 works.forEach((work,n)=>work.addEventListener('click',()=>open(n)));
 close.addEventListener('click',dismiss);
 viewer.querySelector('.viewer-prev').addEventListener('click',()=>show(index-1));
 viewer.querySelector('.viewer-next').addEventListener('click',()=>show(index+1));
 image.addEventListener('click',()=>show(index+1));
 document.addEventListener('keydown',event=>{if(viewer.hidden)return;if(event.key==='Escape')dismiss();if(event.key==='ArrowRight'){event.preventDefault();show(index+1);}if(event.key==='ArrowLeft'){event.preventDefault();show(index-1);}if(event.key==='Tab'){const buttons=[...viewer.querySelectorAll('button')];const first=buttons[0],last=buttons[buttons.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
})();
</script></body></html>
