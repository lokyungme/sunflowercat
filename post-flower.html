<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>post flower — kyung-me</title><link rel="stylesheet" href="style.css"><style>
*{box-sizing:border-box}
.site{display:block!important;min-height:100vh}
.post-flower-main{width:calc(100% - 270px)!important;max-width:none!important;margin:0 0 0 270px!important}
@media(max-width:980px){
html,body{width:100%;overflow-x:hidden}
.site{display:block!important;width:100%;min-height:0}
.post-flower-main{display:block!important;width:100%!important;max-width:none!important;min-height:0!important;margin:0!important;padding:0 12px 70px!important}
.sunflower-chapter{padding-top:28px!important}
.sf-head.sf-head-compact{margin:0 0 34px!important}
.sf-item,.sf-item.left,.sf-item.right,.sf-item.number10,.sf-item.number11,.sf-play .sf-12{max-width:100%!important;margin-left:auto!important;margin-right:auto!important}
.sf-item img,.sf-item.hero img,.sf-item.growing img,.sf-item.tall-final img{width:auto!important;max-width:100%!important;max-height:85svh!important;margin-left:auto;margin-right:auto}
.sf-pair{display:block!important;margin:0}
.sf-pair .sf-item{margin-bottom:85px}
}
html,body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.post-flower-main{padding:8px 12px 90px 12px;overflow:hidden}
.flower-field{max-width:1500px;margin:0 auto}
.page-title{margin:0 0 38px 3vw;font-size:18px;font-weight:400;line-height:1.4}
.flower-item{display:block;width:max-content;max-width:100%;padding:0;border:0;background:none;margin:0 auto 150px;cursor:zoom-in}
.flower-item img{display:block;width:auto;height:auto;max-width:100%;max-height:98vh;max-height:98svh}
.flower-item.left{margin-left:auto;margin-right:auto}
.flower-item.right{margin-left:auto;margin-right:auto}
.flower-item.quiet img{max-height:98vh;max-height:98svh}
.flower-item:last-child{margin-bottom:0}
.flower-item:focus-visible{outline:1px solid #999;outline-offset:6px}
.viewer{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:#fff;padding:40px 48px 48px}
.viewer[hidden]{display:none}
.viewer img{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100svh - 88px)}
.viewer button{border:0;background:transparent;color:#777;font:12px Arial,Helvetica,sans-serif;cursor:pointer;min-width:32px;min-height:32px}
.viewer-close{position:absolute;top:10px;right:12px;font-size:22px!important}
.viewer-prev{position:absolute;left:8px;top:calc(50% - 16px)}
.viewer-next{position:absolute;right:8px;top:calc(50% - 16px)}
.viewer-count{position:absolute;bottom:17px;right:20px;font-size:10px;color:#999}
@media(max-width:980px){
.page-title{margin:0 0 28px;font-size:16px}
.flower-item,.flower-item.left,.flower-item.right{margin:0 auto 85px;max-width:100%}
.flower-item img,.flower-item.quiet img{max-width:100%;max-height:95svh;width:auto;height:auto}
.viewer{padding:48px 32px}
.viewer img{max-height:calc(100svh - 96px)}
}



</style><link rel="stylesheet" href="sidebar.css">
</head><body><div class="site"><script src="sidebar.js"></script><main class="main post-flower-main" data-sidebar-layout="flow"><div class="flower-field"><button class="flower-item" type="button" aria-label="enlarge painting 1"><img src="post%20flower/01.png" alt="Post flower, painting 1" fetchpriority="high" decoding="async"></button>
<button class="flower-item" type="button" aria-label="enlarge painting 2"><img src="post%20flower/02.png" alt="Post flower, painting 2" loading="eager" decoding="async"></button>
<button class="flower-item" type="button" aria-label="enlarge painting 3"><img src="post%20flower/03.png" alt="Post flower, painting 3" loading="eager" decoding="async"></button>
<button class="flower-item" type="button" aria-label="enlarge painting 4"><img src="post%20flower/04.png" alt="Post flower, painting 4" loading="eager" decoding="async"></button>
<button class="flower-item" type="button" aria-label="enlarge painting 5"><img src="post%20flower/05.png" alt="Post flower, painting 5" loading="eager" decoding="async"></button>
<button class="flower-item" type="button" aria-label="enlarge painting 6"><img src="post%20flower/06.png" alt="Post flower, painting 6" loading="eager" decoding="async"></button>
<button class="flower-item" type="button" aria-label="enlarge painting 7"><img src="post%20flower/07.png" alt="Post flower, painting 7" loading="eager" decoding="async"></button></div></main></div><div class="viewer" hidden role="dialog" aria-modal="true" aria-label="post flower paintings"><button class="viewer-close" type="button" aria-label="close">×</button><button class="viewer-prev" type="button" aria-label="previous painting">←</button><img alt=""><button class="viewer-next" type="button" aria-label="next painting">→</button><span class="viewer-count" aria-live="polite"></span></div><script>
(()=>{
 const menu=document.querySelector('.mobile-menu-button'),sidebar=document.querySelector('.sidebar');
 
 const works=[...document.querySelectorAll('.flower-item')],viewer=document.querySelector('.viewer'),image=viewer.querySelector('img'),count=viewer.querySelector('.viewer-count'),close=viewer.querySelector('.viewer-close');
 let index=0,previousFocus,previousOverflow='',request=0;
 function show(n){index=(n+works.length)%works.length;const src=works[index].querySelector('img');const ticket=++request;const next=new Image();next.onload=()=>{if(ticket!==request)return;image.src=next.src;image.alt=src.alt;count.textContent=(index+1)+' / '+works.length;};next.src=src.src;}
 function open(n){previousFocus=document.activeElement;previousOverflow=document.body.style.overflow;viewer.hidden=false;document.body.style.overflow='hidden';image.removeAttribute('src');count.textContent='';show(n);close.focus();}
 function dismiss(){request++;viewer.hidden=true;document.body.style.overflow=previousOverflow;previousFocus?.focus();}
 works.forEach((work,n)=>work.addEventListener('click',()=>open(n)));
 close.addEventListener('click',dismiss);
 viewer.querySelector('.viewer-prev').addEventListener('click',()=>show(index-1));
 viewer.querySelector('.viewer-next').addEventListener('click',()=>show(index+1));
 image.addEventListener('click',()=>show(index+1));
 document.addEventListener('keydown',event=>{if(viewer.hidden)return;if(event.key==='Escape')dismiss();if(event.key==='ArrowRight'){event.preventDefault();show(index+1);}if(event.key==='ArrowLeft'){event.preventDefault();show(index-1);}if(event.key==='Tab'){const buttons=[...viewer.querySelectorAll('button')];const first=buttons[0],last=buttons[buttons.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
})();
</script></body></html>
