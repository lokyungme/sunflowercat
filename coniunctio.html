<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>coniunctio — kyung-me</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.site{display:block!important;min-height:100vh}
.coniunctio-main{width:calc(100% - 270px)!important;max-width:none!important;margin:0 0 0 270px!important;padding:20px 16px 80px!important}
.coniunctio-header{position:fixed;z-index:101;top:0;right:10px;height:20px;display:flex;align-items:center;background:#fff;font-size:11px;white-space:nowrap}
.coniunctio-header a:hover{opacity:.6}
.coniunctio-series{width:min(calc(100vw - 302px),1400px);margin:0 auto;display:flex;flex-direction:column;gap:110px}
.coniunctio-work{margin:0}
.coniunctio-image-button{display:block;width:100%;margin:0;padding:0;border:0;background:none;cursor:pointer;text-align:left}
.coniunctio-image{display:block;width:100%;height:auto}
.coniunctio-caption{display:flex;justify-content:space-between;gap:18px;margin-top:8px;font-size:11px;line-height:1.35}
.coniunctio-caption span:last-child{color:#999;text-align:right}
.coniunctio-detail-controls{display:flex;gap:14px;margin-top:5px;font-size:10px;color:#999}
.coniunctio-detail-controls[hidden]{display:none}
.coniunctio-full-return{padding:0;border:0;background:none;color:#111;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.coniunctio-archive{width:min(calc(100vw - 302px),760px);margin:90px auto 0;padding-top:18px;border-top:1px solid #ddd;font-size:11px;line-height:1.5}
.archive-row{display:grid;grid-template-columns:125px 1fr;gap:18px;margin:5px 0}
.archive-label{color:#999}
.archive-links{display:flex;flex-wrap:wrap;gap:5px 22px}
.archive-row a:hover{text-decoration:underline;text-underline-offset:3px}
@media(max-width:980px){
html,body{width:100%;overflow-x:hidden}
.site{display:block!important;width:100%;min-height:0}
.coniunctio-main{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:0 12px 50px!important}
.coniunctio-header{position:relative;top:auto;right:auto;width:100%;height:20px;justify-content:flex-end;margin:0 0 8px}
.coniunctio-series{width:100%!important;max-width:1400px;gap:58px}
.coniunctio-archive{width:100%!important;max-width:760px}
}
@media(max-width:700px){
.coniunctio-caption{display:block;font-size:9px}
.coniunctio-caption span{display:block}
.coniunctio-caption span:last-child{text-align:left;margin-top:2px}
.coniunctio-archive{margin-top:58px;font-size:9px}
.archive-row{display:block}
.archive-label{display:block;margin-bottom:3px}
.archive-links{display:block}
.archive-links a{display:block;margin:2px 0}
}
</style>
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
<div class="site">
  <script src="sidebar.js"></script>
  <main class="coniunctio-main" data-sidebar-layout="flow">
    <div class="coniunctio-header"><a href="https://bureau-inc.com/exhibitions/coniunctio" target="_blank" rel="noopener">coniunctio</a></div>
    <div class="coniunctio-series" id="coniunctio-series"></div>
    <footer class="coniunctio-archive">
      <div class="archive-row"><span class="archive-label">exhibition</span><a href="https://bureau-inc.com/exhibitions/coniunctio" target="_blank" rel="noopener">bureau</a></div>
      <div class="archive-row"><span class="archive-label">press / features</span><span class="archive-links">
        <a href="https://assets.ctfassets.net/hp42m99tzs4o/7qmBjk3U6IIDjY7UzsFK93/f145df1c36a9117fb9bfc34bf63ee6ac/HGH_2019.12_Artforum.caption.pdf" target="_blank" rel="noopener">artforum</a>
        <a href="https://assets.ctfassets.net/hp42m99tzs4o/43Dx7O0YWrA0Ybc00Y04Yv/db7d51896dbde68b121c121b2d6118e6/KM_2020.01_NewYorker.caption.pdf" target="_blank" rel="noopener">the new yorker</a>
        <a href="https://assets.ctfassets.net/hp42m99tzs4o/10zChZgZx8BGJTQs19LEVw/adc0e9aa3895f7dfa8fb46c8ac655594/KM_2020.01_TheOffing.caption.pdf" target="_blank" rel="noopener">the offing</a>
        <a href="https://assets.ctfassets.net/hp42m99tzs4o/2efShVhe1gsxmEdHQ2nrwt/ece46b1ddc94c3cec3f78b7b90ab2cef/KM_2020.01_EditorialMagazine.caption.pdf" target="_blank" rel="noopener">editorial magazine</a>
      </span></div>
    </footer>
  </main>
</div>
<script>
const menuButton=document.querySelector('.mobile-menu-button');
const sidebar=document.querySelector('.sidebar');


const coniunctioWorks=[
 {src:"Coniunctio/01.jpg",title:"coniunctio I",details:["Coniunctio/01_crop1.jpg"]},
 {src:"Coniunctio/02.jpg",title:"coniunctio II",details:["Coniunctio/02_crop1.jpg","Coniunctio/02_crop2.jpg"]},
 {src:"Coniunctio/03.jpg",title:"coniunctio III",details:["Coniunctio/03_crop1.jpg","Coniunctio/03_crop2.jpg"]},
 {src:"Coniunctio/04.jpg",title:"coniunctio IV",details:["Coniunctio/04_crop1.jpg","Coniunctio/04_crop2.jpg"]},
 {src:"Coniunctio/05.jpg",title:"coniunctio V",details:["Coniunctio/05_crop1.jpg","Coniunctio/05_crop2.jpg"]},
 {src:"Coniunctio/06.jpg",title:"coniunctio VI",details:["Coniunctio/06_crop1.jpg"]},
 {src:"Coniunctio/07.jpg",title:"coniunctio VII",details:["Coniunctio/07_crop1.jpg"]}
];
const series=document.getElementById("coniunctio-series");let activeFigure=null;
series.innerHTML=coniunctioWorks.map((work,index)=>`<figure class="coniunctio-work"><button class="coniunctio-image-button" type="button" data-work="${index}" aria-label="view details of ${work.title}"><img class="coniunctio-image" src="${work.src}" alt="${work.title}"></button><figcaption class="coniunctio-caption"><span>${work.title}</span><span>ink + charcoal on paper, 36 × 24 in.</span></figcaption><div class="coniunctio-detail-controls" hidden><button class="coniunctio-full-return" type="button">full image</button><span class="coniunctio-detail-count"></span></div></figure>`).join("");
function showFull(figure,keepActive=false){const index=Number(figure.querySelector(".coniunctio-image-button").dataset.work);const work=coniunctioWorks[index];const image=figure.querySelector(".coniunctio-image");figure.dataset.detailIndex="-1";image.src=work.src;image.alt=work.title;figure.querySelector(".coniunctio-detail-controls").hidden=true;activeFigure=keepActive?figure:null}
function showDetail(figure,detailIndex){const index=Number(figure.querySelector(".coniunctio-image-button").dataset.work);const work=coniunctioWorks[index];const next=(detailIndex+work.details.length)%work.details.length;const image=figure.querySelector(".coniunctio-image");figure.dataset.detailIndex=String(next);image.src=work.details[next];image.alt=`${work.title}, detail ${next+1}`;figure.querySelector(".coniunctio-detail-controls").hidden=false;figure.querySelector(".coniunctio-detail-count").textContent=`detail ${next+1} / ${work.details.length}`;activeFigure=figure}
function moveSlide(figure,delta){const index=Number(figure.querySelector(".coniunctio-image-button").dataset.work);const total=coniunctioWorks[index].details.length;const current=Number(figure.dataset.detailIndex??-1);if(delta>0){if(current===total-1)showFull(figure,true);else showDetail(figure,current+1)}else{if(current===-1)showDetail(figure,total-1);else if(current===0)showFull(figure,true);else showDetail(figure,current-1)}}
series.addEventListener("click",event=>{const returnButton=event.target.closest(".coniunctio-full-return");if(returnButton){showFull(returnButton.closest(".coniunctio-work"));return}const imageButton=event.target.closest(".coniunctio-image-button");if(imageButton)moveSlide(imageButton.closest(".coniunctio-work"),1)});
document.addEventListener("keydown",event=>{if(!activeFigure)return;if(event.key==="ArrowRight"||event.key===" "){event.preventDefault();moveSlide(activeFigure,1)}if(event.key==="ArrowLeft"){event.preventDefault();moveSlide(activeFigure,-1)}if(event.key==="Escape")showFull(activeFigure)});
</script>
</body>
</html>
