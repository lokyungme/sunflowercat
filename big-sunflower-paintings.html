<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>large sunflower paintings — kyung-me</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: calc(100% - 270px);
      margin-left: 270px;
      padding: 0;
    }

    figure {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: 100svh;
      margin: 0 0 100px;
      padding-top: 18px;
    }

    figure:last-child { margin-bottom: 0; }

    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100svh - 18px);
    }

    a { color: inherit; text-decoration: none; }
    .sidebar { position: fixed; z-index: 110; inset: 0 auto 0 0; width: 270px; padding: 22px 22px 28px; background: #fff; display: flex; flex-direction: column; overflow-y: auto; }
    .name { margin: 0 0 30px; width: 72px; font-size: 0; line-height: 0; }
    .name a, .stamp { display: block; width: 100%; height: auto; }
    .projects { display: flex; flex-direction: column; align-items: stretch; gap: 11px; }
    .projects a { display: grid; grid-template-columns: 43px minmax(0, 1fr); width: auto; font-size: 12px; font-weight: 400; line-height: 1.25; letter-spacing: 0; text-transform: none; }
    .project-year { color: #999; font-size: 10px; line-height: 1.5; }
    .projects a:hover .project-name { text-decoration: underline; text-underline-offset: 3px; }
    .menu-secondary { display: flex; flex-direction: row; align-items: center; gap: 12px; margin-top: auto; padding-top: 42px; }
    .menu-secondary a { color: #999; font-size: 10px; font-weight: 400; line-height: 1.25; letter-spacing: 0; text-transform: none; }
    .menu-secondary a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .side-top { margin: 0 0 22px; }
    .studio-note { display: grid; grid-template-columns: 43px minmax(0, 1fr); align-items: baseline; margin: 0; max-width: none; font-size: 12px; font-weight: 400; line-height: 1.25; color: #111; letter-spacing: 0; text-transform: none; }
    .studio-now { color: #999; font-size: 10px; line-height: 1.5; }
    .studio-note a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .mobile-menu-button { display: none; }

    @media (max-width: 980px) {
      html, body { width: 100%; overflow-x: hidden; }
      .sidebar { position: relative; inset: auto; width: 100%; min-height: 0; padding: 18px 18px 16px; overflow: visible; }
      .name { width: 58px; margin-bottom: 18px; }
      .side-top { margin-bottom: 14px; }
      .mobile-menu-button { display: block; width: max-content; min-height: 32px; padding: 0; border: 0; background: none; color: #111; font: 12px Arial, Helvetica, sans-serif; text-align: left; cursor: pointer; }
      .mobile-menu-button:focus-visible { outline: 1px solid #111; outline-offset: 4px; }
      .projects, .menu-secondary { display: none; }
      .sidebar.menu-open .projects { display: flex; margin-top: 18px; }
      .sidebar.menu-open .menu-secondary { display: flex; }
      .projects { gap: 10px; }
      .projects a { display: grid; grid-template-columns: 43px minmax(0, 1fr); font-size: 12px; }
      .project-year { display: inline; font-size: 10px; margin-bottom: 0; }
      .menu-secondary { gap: 12px; margin-top: 0; padding-top: 34px; }
      .menu-secondary a { font-size: 10px; }
      main { width: 100%; margin: 0; padding: 0 12px 24px; }
      figure { height: calc(100svh - 170px); min-height: 320px; margin-bottom: 72px; padding-top: 0; }
      figure img { max-width: 100%; max-height: 100%; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1 class="name"><a href="index" aria-label="home"><img class="stamp" src="https://media.cargocollective.com/1/10/322251/headerimg/light-stamp-180-copy.png" alt="kyung-me stamp"></a></h1>
    <div class="side-top"><p class="studio-note"><span class="studio-now">now</span><a href="pkan">paintings for pkan</a></p></div>
    <button class="mobile-menu-button" type="button" aria-expanded="false" aria-controls="project-links information-links">works +</button>
    <nav class="projects" id="project-links" aria-label="projects">
      <a href="post-flower"><span class="project-year">2026</span><span class="project-name">post flower</span></a>
    <a href="sunflower"><span class="project-year">2026</span><span class="project-name">i, sunflower</span></a>
      <a href="blossoms"><span class="project-year">2025</span><span class="project-name">blossoms</span></a>
      <a href="ink-paintings"><span class="project-year">2025</span><span class="project-name">ink paintings</span></a>
      <a href="more-ink-drawings"><span class="project-year">2024</span><span class="project-name">ink drawings</span></a>
      <a href="house-in-the-trees"><span class="project-year">2023</span><span class="project-name">the house in the trees</span></a>
      <a href="sister"><span class="project-year">2022</span><span class="project-name">sister</span></a>
      <a href="coniunctio"><span class="project-year">2019</span><span class="project-name">coniunctio</span></a>
      <a href="half-mourning"><span class="project-year">2018</span><span class="project-name">half mourning</span></a>
      <a href="copy-kitty"><span class="project-year">2017</span><span class="project-name">copy kitty</span></a>
      <a href="ghost"><span class="project-year">2016</span><span class="project-name">ghost</span></a>
      <a href="labyrinths"><span class="project-year">2015</span><span class="project-name">labyrinths</span></a>
      <a href="bad-korean"><span class="project-year">2014</span><span class="project-name">bad korean</span></a>
    </nav>
    <nav class="menu-secondary" id="information-links" aria-label="information pages"><a href="about">about</a><a href="teaching">teaching</a><a href="cv">cv</a></nav>
  </aside>
  <main>
    <figure><img src="big sf paintings/01_the fall.png" width="2351" height="4140" alt="Large sunflower painting by Kyung-Me"></figure>
    <figure><img src="big sf paintings/02_exp.png" width="2110" height="4087" alt="Large sunflower painting by Kyung-Me" loading="lazy"></figure>
    <figure><img src="big sf paintings/03_redfall.png" width="2305" height="4101" alt="Large sunflower painting by Kyung-Me" loading="lazy"></figure>
    <figure><img src="big sf paintings/04yellow.png" width="2235" height="4069" alt="Large sunflower painting by Kyung-Me" loading="lazy"></figure>
    <figure><img src="big sf paintings/05_rainbow.png" width="2193" height="3582" alt="Large sunflower painting by Kyung-Me" loading="lazy"></figure>
  </main>
  <script>
    const menuButton = document.querySelector('.mobile-menu-button');
    const sidebar = document.querySelector('.sidebar');
    menuButton.addEventListener('click', () => {
      const isOpen = sidebar.classList.toggle('menu-open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.textContent = isOpen ? 'works −' : 'works +';
    });
  </script>
</body>
</html>
