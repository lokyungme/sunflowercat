<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ghost — kyung-me</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.top{position:fixed;z-index:40;top:0;left:270px;right:0;height:20px;padding:0 16px;display:flex;align-items:center;justify-content:flex-end;background:#fff;font-size:11px}
.viewer{position:absolute;inset:20px 0 0 270px;background:#fff}
.art{position:absolute;top:0;left:50%;transform:translateX(-50%);display:block;max-width:calc(100vw - 270px);max-height:calc(100vh - 20px);width:auto;height:auto;opacity:0;transition:opacity 180ms linear;user-select:none;-webkit-user-drag:none}
.art.active{opacity:1}
.zone{position:fixed;z-index:30;top:20px;bottom:0;width:calc((100% - 270px)/2);border:0;background:transparent;padding:0;cursor:pointer}
.prev{left:270px;cursor:w-resize}
.next{right:0;cursor:e-resize}
@media(max-width:980px){
html,body{width:100%;height:auto;min-height:100svh;overflow-x:hidden;overflow-y:auto}
body{display:flex;flex-direction:column}
.top{position:relative;top:auto;left:auto;right:auto;width:100%;height:20px;padding:0 12px;flex:none}
.viewer{position:relative;inset:auto;width:100%;height:calc(100svh - 190px);min-height:300px;flex:1 0 auto}
.art{max-width:100%;max-height:100%;object-fit:contain}
.zone{position:absolute;top:0;bottom:0;width:50%}
.prev{left:0}
.next{right:0}
}
@media(prefers-reduced-motion:reduce){
.art{transition:none}}
</style>
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
<script src="sidebar.js"></script>
<header class="top">
 <div>ghost</div>
</header>
<main class="viewer" data-sidebar-layout="fixed">
 <img id="art-a" class="art active" src="Ghost/ghost%201.jpg" alt="Ghost I" aria-hidden="false">
 <img id="art-b" class="art" src="" alt="" aria-hidden="true">
 <button class="zone prev" id="prev" aria-label="previous image"></button>
 <button class="zone next" id="next" aria-label="next image"></button>
</main>
<script>
const menuButton=document.querySelector('.mobile-menu-button');
const sidebar=document.querySelector('.sidebar');


const works=[
 ['Ghost/ghost%201.jpg','Ghost I'],
 ['Ghost/ghost%202.jpg','Ghost II'],
 ['Ghost/ghost%203.jpg','Ghost III'],
 ['Ghost/ghost%204.jpg','Ghost IV'],
 ['Ghost/ghost%205.jpg','Ghost V']
];
let i=0,transitionToken=0;
let front=document.getElementById('art-a'),back=document.getElementById('art-b');
works.forEach(work=>{const image=new Image();image.src=work[0]});
function show(n){
 i=(n+works.length)%works.length;
 const work=works[i],token=++transitionToken;
 back.onload=()=>{
  if(token!==transitionToken)return;
  back.alt=work[1];
  back.setAttribute('aria-hidden','false');
  front.setAttribute('aria-hidden','true');
  back.classList.add('active');
  front.classList.remove('active');
  [front,back]=[back,front];
 };
 back.src=work[0];
}
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',event=>{
 if(event.key==='ArrowRight')show(i+1);
 if(event.key==='ArrowLeft')show(i-1);
});
</script>
</body>
</html>
