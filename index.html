<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kyung-me</title>
<link rel="stylesheet" href="style.css">
<style>
.hero-main{
    justify-content:flex-start;
    padding:12px 12px 12px 4px!important;
  }
.hero-link{
    display:block;
    width:100%;
    max-width:none;
    transform:none;
  }
.hero-image{
    display:block;
    width:100%;
    height:calc(100vh - 24px);
    max-height:none;
    object-fit:contain;
    object-position:left center;
  }
  @media(max-width:720px){
.topbar{
      position:absolute;
      top:20px;
      left:96px;
      right:16px;
      min-height:58px;
      height:auto;
      padding:0;
      border:0;
      background:transparent;
      justify-content:flex-end;
      z-index:4;
    }
.topnav{
      justify-content:flex-end;
      gap:7px 14px;
      white-space:normal;
      line-height:1.35;
    }
.hero-main{padding:10px 6px 24px!important;}
.hero-link{transform:none;}
.hero-image{width:100%;height:auto;max-height:none;object-position:center;}
  }
  @media(max-width:420px){
.topnav{gap:6px 10px;}
.topnav a{font-size:9px;}
  }
*{box-sizing:border-box}
.site{display:block!important;min-height:100vh}
.hero-main{width:calc(100% - 270px)!important;max-width:none!important;margin:0 0 0 270px!important}

  /* Tablet-sized previews and landscape phones need the stacked layout too. */
  @media(max-width:980px){
html,body{width:100%;overflow-x:hidden}
.site{display:block!important;width:100%;min-height:0}
.hero-main{
      display:block!important;
      width:100%!important;
      max-width:none!important;
      margin:0!important;
      padding:0 12px 24px!important;
    }
.hero-link{display:block!important;width:100%!important}
.hero-image{
      display:block!important;
      width:100%!important;
      height:auto!important;
      max-height:none!important;
      object-fit:contain!important;
      object-position:center top!important;
    }
  }
</style>
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="site">
    <script src="sidebar.js"></script>

    <main class="main hero-main" data-sidebar-layout="flow">
      <a class="hero-link" href="sunflower" aria-label="view i, sunflower">
        <img class="hero-image" src="i-sunflower-install/02.jpg" alt="installation view of i, sunflower" />
      </a>
    </main>
  </div>
  <script>
    const menuButton = document.querySelector('.mobile-menu-button');
    const sidebar = document.querySelector('.sidebar');
    
  </script>
</body>
</html>
