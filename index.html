<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kyung-me</title>
<link rel="stylesheet" href="style.css">
<style>
  .hero-main{
    justify-content:flex-start;
    padding:12px 12px 12px 4px!important;
  }
  .hero-link{
    display:block;
    width:100%;
    max-width:none;
    transform:none;
  }
  .hero-image{
    display:block;
    width:100%;
    height:calc(100vh - 24px);
    max-height:none;
    object-fit:contain;
    object-position:left center;
  }
  @media(max-width:720px){
    .topbar{
      position:absolute;
      top:20px;
      left:96px;
      right:16px;
      min-height:58px;
      height:auto;
      padding:0;
      border:0;
      background:transparent;
      justify-content:flex-end;
      z-index:4;
    }
    .topnav{
      justify-content:flex-end;
      gap:7px 14px;
      white-space:normal;
      line-height:1.35;
    }
    .hero-main{padding:10px 6px 24px!important;}
    .hero-link{transform:none;}
    .hero-image{width:100%;height:auto;max-height:none;object-position:center;}
  }
  @media(max-width:420px){
    .topnav{gap:6px 10px;}
    .topnav a{font-size:9px;}
  }

  *{box-sizing:border-box}
  .site{display:block!important;min-height:100vh}
  .sidebar{position:fixed!important;z-index:110;inset:0 auto 0 0!important;width:270px!important;padding:22px 22px 28px!important;background:#fff;display:flex!important;flex-direction:column;overflow-y:auto}
  .name{margin:0 0 30px!important;width:72px!important;font-size:0!important;line-height:0!important}
  .name a,.stamp{display:block;width:100%;height:auto}
  .projects{display:flex!important;flex-direction:column;align-items:stretch!important;gap:11px!important}
  .projects a{display:grid!important;grid-template-columns:43px minmax(0,1fr)!important;width:auto!important;font-family:Arial,Helvetica,sans-serif!important;font-size:12px!important;font-weight:400!important;line-height:1.25!important;color:inherit;text-decoration:none;letter-spacing:0!important;text-transform:none!important}
  .project-year{color:#999;font-size:10px!important;line-height:1.5!important}
  .projects a:hover .project-name{text-decoration:underline;text-underline-offset:3px}
  .menu-secondary{display:flex!important;flex-direction:row!important;align-items:center!important;gap:12px!important;margin-top:auto!important;padding-top:42px!important}
  .menu-secondary a{color:#999!important;text-decoration:none!important;font-family:Arial,Helvetica,sans-serif!important;font-size:10px!important;font-weight:400!important;line-height:1.25!important;letter-spacing:0!important;text-transform:none!important}
  .menu-secondary a:hover{text-decoration:underline!important;text-underline-offset:3px}
  .side-top{margin:0 0 22px!important}
  .studio-note{display:grid!important;grid-template-columns:43px minmax(0,1fr)!important;align-items:baseline!important;margin:0!important;max-width:none!important;font-family:Arial,Helvetica,sans-serif!important;font-size:12px!important;font-weight:400!important;line-height:1.25!important;color:#111!important;letter-spacing:0!important;text-transform:none!important}
  .studio-now{color:#999!important;font-size:10px!important;line-height:1.5!important}
  .studio-note a{color:inherit!important;text-decoration:none!important;letter-spacing:0!important;font-weight:400!important;text-transform:none!important}
  .studio-note a:hover{text-decoration:underline!important;text-underline-offset:3px}
  .hero-main{width:calc(100% - 270px)!important;max-width:none!important;margin:0 0 0 270px!important}

  /* Tablet-sized previews and landscape phones need the stacked layout too. */
  @media(max-width:980px){
    html,body{width:100%;overflow-x:hidden}
    .site{display:block!important;width:100%;min-height:0}
    .sidebar{
      position:relative!important;
      inset:auto!important;
      width:100%!important;
      min-height:0!important;
      padding:18px 18px 24px!important;
      overflow:visible!important;
    }
    .name{width:58px!important;margin-bottom:24px!important}
    .projects{gap:10px!important}
    .projects a{display:grid!important;grid-template-columns:43px minmax(0,1fr)!important;font-size:12px!important}
    .project-year{display:inline!important;font-size:10px!important;margin-bottom:0!important}
    .menu-secondary{gap:12px!important;margin-top:0!important;padding-top:34px!important}
    .menu-secondary a{font-size:10px!important}
    .side-top{margin-bottom:20px!important}
    .hero-main{
      display:block!important;
      width:100%!important;
      max-width:none!important;
      margin:0!important;
      padding:0 12px 24px!important;
    }
    .hero-link{display:block!important;width:100%!important}
    .hero-image{
      display:block!important;
      width:100%!important;
      height:auto!important;
      max-height:none!important;
      object-fit:contain!important;
      object-position:center top!important;
    }
  }
</style>
</head>
<body>
  <div class="site">
    <aside class="sidebar">
      <h1 class="name"><a href="index" aria-label="home"><img class="stamp" src="https://media.cargocollective.com/1/10/322251/headerimg/light-stamp-180-copy.png" alt="kyung-me stamp"></a></h1>
      <div class="side-top"><p class="studio-note"><span class="studio-now">now</span><a href="pkan">paintings for pkan</a></p></div>
      <nav class="projects" aria-label="projects">
        <a href="sunflower"><span class="project-year">2026</span><span class="project-name">i, sunflower</span></a>
        <a href="more-ink-drawings"><span class="project-year">2024</span><span class="project-name">more ink drawings</span></a>
        <a href="house-in-the-trees"><span class="project-year">2023</span><span class="project-name">the house in the trees</span></a>
        <a href="sister"><span class="project-year">2022</span><span class="project-name">sister</span></a>
        <a href="coniunctio"><span class="project-year">2019</span><span class="project-name">coniunctio</span></a>
        <a href="half-mourning"><span class="project-year">2018</span><span class="project-name">half mourning</span></a>
        <a href="copy-kitty"><span class="project-year">2017</span><span class="project-name">copy kitty</span></a>
        <a href="ghost"><span class="project-year">2016</span><span class="project-name">ghost</span></a>
        <a href="labyrinths"><span class="project-year">2015</span><span class="project-name">labyrinths</span></a>
        <a href="bad-korean"><span class="project-year">2014</span><span class="project-name">bad korean</span></a>
      </nav>
      <nav class="menu-secondary" aria-label="information pages"><a href="about">about</a><a href="teaching">teaching</a><a href="cv">cv</a></nav>
    </aside>

    <main class="main hero-main">
      <a class="hero-link" href="sunflower" aria-label="view i, sunflower">
        <img class="hero-image" src="i-sunflower-install/02.jpg" alt="installation view of i, sunflower" />
      </a>
    </main>
  </div>

</body>
</html>
