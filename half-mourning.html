<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>half mourning — kyung-me</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.site{display:block!important;min-height:100vh}
.half-main{width:calc(100% - 270px)!important;max-width:none!important;margin:0 0 0 270px!important;padding:20px 16px 80px!important}
.half-header{position:fixed;z-index:101;top:0;right:10px;height:20px;display:flex;align-items:center;background:#fff;font-size:11px;white-space:nowrap}
.half-series{width:min(calc(100vw - 302px),1400px);margin:0 auto;display:flex;flex-direction:column;gap:110px}
.half-work{margin:0}
.half-image-button{display:block;width:100%;margin:0;padding:0;border:0;background:none;cursor:pointer;text-align:left}
.half-image{display:block;width:100%;height:auto}
.half-caption{display:flex;justify-content:space-between;gap:18px;margin-top:8px;font-size:11px;line-height:1.35}
.half-caption span:last-child{color:#999;text-align:right}
.half-detail-controls{display:flex;gap:14px;margin-top:5px;font-size:10px;color:#999}
.half-detail-controls[hidden]{display:none}
.half-full-return{padding:0;border:0;background:none;color:#111;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media(max-width:980px){
html,body{width:100%;overflow-x:hidden}
.site{display:block!important;width:100%;min-height:0}
.half-main{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:0 12px 50px!important}
.half-header{position:relative;top:auto;right:auto;width:100%;height:20px;justify-content:flex-end;margin:0 0 8px}
.half-series{width:100%!important;max-width:1400px;gap:58px}
}
@media(max-width:700px){
.half-caption{display:block;font-size:9px}
.half-caption span{display:block}
.half-caption span:last-child{text-align:left;margin-top:2px}
}
</style>
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
<div class="site">
  <script src="sidebar.js"></script>
  <main class="half-main" data-sidebar-layout="flow">
    <div class="half-header">half mourning</div>
    <div class="half-series" id="half-series"></div>
  </main>
</div>
<script>
const menuButton=document.querySelector('.mobile-menu-button');
const sidebar=document.querySelector('.sidebar');


const halfWorks=[
 {src:"Half%20Mourning/hm1.jpg",title:"half mourning I",details:["Half%20Mourning/hm1_detail1.jpg","Half%20Mourning/hm1_detail2.jpg","Half%20Mourning/hm1_detail3.jpg"]},
 {src:"Half%20Mourning/hm2.jpg",title:"half mourning II",details:["Half%20Mourning/hm2_detail1.jpg","Half%20Mourning/hm2_detail2.jpg"]},
 {src:"Half%20Mourning/hm3.jpg",title:"half mourning III",details:["Half%20Mourning/hm3_detail.jpg","Half%20Mourning/hm3_detail3.jpg","Half%20Mourning/hm3_detail4.jpg","Half%20Mourning/hm3_detail5.jpg"]},
 {src:"Half%20Mourning/hm4.jpg",title:"half mourning IV",details:["Half%20Mourning/hm4_detail1.jpg","Half%20Mourning/hm4_detail2.jpg","Half%20Mourning/hm4_detail3.jpg"]}
];
const series=document.getElementById("half-series");let activeFigure=null;
series.innerHTML=halfWorks.map((work,index)=>`<figure class="half-work"><button class="half-image-button" type="button" data-work="${index}" aria-label="view details of ${work.title}"><img class="half-image" src="${work.src}" alt="${work.title}"></button><figcaption class="half-caption"><span>${work.title}</span><span>ink + charcoal on paper, 24 × 18 in.</span></figcaption><div class="half-detail-controls" hidden><button class="half-full-return" type="button">full image</button><span class="half-detail-count"></span></div></figure>`).join("");
function showFull(figure,keepActive=false){const index=Number(figure.querySelector(".half-image-button").dataset.work);const work=halfWorks[index];const image=figure.querySelector(".half-image");figure.dataset.detailIndex="-1";image.src=work.src;image.alt=work.title;figure.querySelector(".half-detail-controls").hidden=true;activeFigure=keepActive?figure:null}
function showDetail(figure,detailIndex){const index=Number(figure.querySelector(".half-image-button").dataset.work);const work=halfWorks[index];if(!work.details.length)return;const next=(detailIndex+work.details.length)%work.details.length;const image=figure.querySelector(".half-image");figure.dataset.detailIndex=String(next);image.src=work.details[next];image.alt=`${work.title}, detail ${next+1}`;figure.querySelector(".half-detail-controls").hidden=false;figure.querySelector(".half-detail-count").textContent=`detail ${next+1} / ${work.details.length}`;activeFigure=figure}
function moveSlide(figure,delta){const index=Number(figure.querySelector(".half-image-button").dataset.work);const total=halfWorks[index].details.length;const current=Number(figure.dataset.detailIndex??-1);if(delta>0){if(current===total-1)showFull(figure,true);else showDetail(figure,current+1)}else{if(current===-1)showDetail(figure,total-1);else if(current===0)showFull(figure,true);else showDetail(figure,current-1)}}
series.addEventListener("click",event=>{const returnButton=event.target.closest(".half-full-return");if(returnButton){showFull(returnButton.closest(".half-work"));return}const imageButton=event.target.closest(".half-image-button");if(imageButton)moveSlide(imageButton.closest(".half-work"),1)});
document.addEventListener("keydown",event=>{if(!activeFigure)return;if(event.key==="ArrowRight"||event.key===" "){event.preventDefault();moveSlide(activeFigure,1)}if(event.key==="ArrowLeft"){event.preventDefault();moveSlide(activeFigure,-1)}if(event.key==="Escape")showFull(activeFigure)});
</script>
</body>
</html>
