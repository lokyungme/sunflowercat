<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>the house in the trees — kyung-me</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}.site{display:block!important;min-height:100vh}
.sidebar{position:fixed!important;z-index:110;inset:0 auto 0 0!important;width:270px!important;padding:22px 22px 28px;background:#fff;display:flex!important;flex-direction:column;overflow-y:auto}
.name{margin:0 0 30px!important;width:72px;font-size:0;line-height:0}.name a,.stamp{display:block;width:100%;height:auto}
.projects{display:flex!important;flex-direction:column;align-items:stretch!important;gap:11px!important}
.projects a{display:grid!important;grid-template-columns:43px minmax(0,1fr)!important;width:auto!important;font-family:Arial,Helvetica,sans-serif!important;font-size:12px!important;font-weight:400!important;line-height:1.25;color:inherit;text-decoration:none;letter-spacing:0!important;text-transform:none!important}
.project-year{color:#999;font-size:10px!important;line-height:1.5}.projects a:hover .project-name{text-decoration:underline;text-underline-offset:3px}
.menu-secondary{display:flex;flex-direction:row;align-items:center;gap:12px;margin-top:auto;padding-top:42px}
.menu-secondary a{color:#999;text-decoration:none;font-family:Arial,Helvetica,sans-serif!important;font-size:10px!important;font-weight:400!important;line-height:1.25!important;letter-spacing:0!important;text-transform:none!important}
.menu-secondary a:hover{text-decoration:underline;text-underline-offset:3px}
.side-top{margin:0 0 22px}
.studio-note{display:grid;grid-template-columns:43px minmax(0,1fr);align-items:baseline;margin:0;max-width:none;font-family:Arial,Helvetica,sans-serif!important;font-size:12px!important;font-weight:400!important;line-height:1.25;color:#111;letter-spacing:0!important;text-transform:none!important}
.studio-now{color:#999;font-size:10px!important;line-height:1.5}.studio-note a{color:inherit;text-decoration:none;letter-spacing:0!important;font-weight:400!important;text-transform:none!important}.studio-note a:hover{text-decoration:underline;text-underline-offset:3px}
.house-main{width:calc(100% - 270px)!important;max-width:none!important;margin:0 0 0 270px!important;padding:20px 16px 80px!important}
.house-header{position:fixed;z-index:101;top:0;right:10px;height:20px;display:flex;align-items:center;background:#fff;font-size:11px;white-space:nowrap}.house-header a:hover{opacity:.6}
.house-series{width:min(calc(100vw - 302px),1400px);margin:0 auto;display:flex;flex-direction:column;gap:110px}.house-work{margin:0}
.house-image-button{display:block;width:100%;margin:0;padding:0;border:0;background:none;cursor:pointer;text-align:left}.house-image{display:block;width:100%;height:auto}
.house-caption{display:flex;justify-content:space-between;gap:18px;margin-top:8px;font-size:11px;line-height:1.35}.house-caption span:last-child{color:#999;text-align:right}
.house-detail-controls{display:flex;gap:14px;margin-top:5px;font-size:10px;color:#999}.house-detail-controls[hidden]{display:none}
.house-full-return{padding:0;border:0;background:none;color:#111;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media(max-width:700px){
 .sidebar{width:148px!important;padding:16px 13px 22px}.name{width:58px;margin-bottom:24px!important}.projects{gap:10px!important}
 .projects a{display:block!important;font-size:12px!important}.project-year{display:block;font-size:10px!important;margin-bottom:1px}.menu-secondary{gap:9px;margin-top:auto;padding-top:32px}.menu-secondary a{font-size:9px!important}.side-top{margin-bottom:20px}
 .house-main{width:calc(100% - 148px)!important;margin-left:148px!important;padding:20px 8px 50px!important}.house-header{right:8px;height:20px}
 .house-series{width:100%!important;gap:58px}.house-caption{display:block;font-size:9px}.house-caption span{display:block}.house-caption span:last-child{text-align:left;margin-top:2px}
}
</style>
</head>
<body>
<div class="site">
  <aside class="sidebar">
    <h1 class="name"><a href="index" aria-label="home"><img class="stamp" src="https://media.cargocollective.com/1/10/322251/headerimg/light-stamp-180-copy.png" alt="kyung-me stamp"></a></h1>
    <div class="side-top"><p class="studio-note"><span class="studio-now">now</span><a href="pkan">paintings for pkan</a></p></div>
    <nav class="projects" aria-label="projects">
      <a href="sunflower"><span class="project-year">2026</span><span class="project-name">i, sunflower</span></a>
      <a href="more-ink-drawings"><span class="project-year">2024</span><span class="project-name">more ink drawings</span></a>
      <a href="house-in-the-trees"><span class="project-year">2023</span><span class="project-name">the house in the trees</span></a>
      <a href="sister"><span class="project-year">2022</span><span class="project-name">sister</span></a>
      <a href="coniunctio"><span class="project-year">2019</span><span class="project-name">coniunctio</span></a>
      <a href="half-mourning"><span class="project-year">2018</span><span class="project-name">half mourning</span></a>
      <a href="copy-kitty"><span class="project-year">2017</span><span class="project-name">copy kitty</span></a>
      <a href="ghost"><span class="project-year">2016</span><span class="project-name">ghost</span></a>
      <a href="labyrinths"><span class="project-year">2015</span><span class="project-name">labyrinths</span></a>
      <a href="bad-korean"><span class="project-year">2014</span><span class="project-name">bad korean</span></a>
    </nav>
    <nav class="menu-secondary" aria-label="information pages"><a href="about">about</a><a href="teaching">teaching</a><a href="cv">cv</a></nav>
  </aside>
  <main class="house-main">
    <div class="house-header"><a href="https://kiangmalingue.com/exhibitions/kyung-me-the-house-in-the-trees/" target="_blank" rel="noopener">the house in the trees</a></div>
    <div class="house-series" id="house-series"></div>
  </main>
</div>
<script>
const houseWorks=[
 {src:"House%20in%20the%20trees/01_The%20Mask.jpg",title:"The Mask",dimensions:"16 × 24 in.",details:["House%20in%20the%20trees/01_closeup.jpg"]},
 {src:"House%20in%20the%20trees/02_The%20Doll.jpg",title:"The Doll",dimensions:"16 × 24 in.",details:["House%20in%20the%20trees/02_closeupjpg.jpg","House%20in%20the%20trees/02_closeup2.jpg"]},
 {src:"House%20in%20the%20trees/03_The%20Bonsai.jpg",title:"The Bonsai",dimensions:"16 × 24 in.",details:[]},
 {src:"House%20in%20the%20trees/04_The%20Shrine.jpg",title:"The Shrine",dimensions:"16 × 24 in.",details:["House%20in%20the%20trees/04_closeup.jpg"]},
 {src:"House%20in%20the%20trees/05_The%20Corridor.jpg",title:"The Corridor",dimensions:"12 × 18 in.",details:["House%20in%20the%20trees/05_closeup.jpg"]},
 {src:"House%20in%20the%20trees/06_The%20Slumber.jpg",title:"The Slumber",dimensions:"12 × 18 in.",details:[]},
 {src:"House%20in%20the%20trees/07_The%20Clocktower.jpg",title:"The Clocktower",dimensions:"12 × 18 in.",details:[]},
 {src:"House%20in%20the%20trees/08_The%20Dollhouse.jpg",title:"The Dollhouse",dimensions:"16 × 24 in.",details:["House%20in%20the%20trees/08_closep.jpg"]}
];
const series=document.getElementById("house-series");let activeFigure=null;
series.innerHTML=houseWorks.map((work,index)=>`<figure class="house-work"><button class="house-image-button" type="button" data-work="${index}" aria-label="view details of ${work.title}"><img class="house-image" src="${work.src}" alt="${work.title}"></button><figcaption class="house-caption"><span>${work.title}</span><span>${work.dimensions}<br>ink and charcoal on paper</span></figcaption><div class="house-detail-controls" hidden><button class="house-full-return" type="button">full image</button><span class="house-detail-count"></span></div></figure>`).join("");
function showFull(figure,keepActive=false){const index=Number(figure.querySelector(".house-image-button").dataset.work);const work=houseWorks[index];const image=figure.querySelector(".house-image");figure.dataset.detailIndex="-1";image.src=work.src;image.alt=work.title;figure.querySelector(".house-detail-controls").hidden=true;activeFigure=keepActive?figure:null}
function showDetail(figure,detailIndex){const index=Number(figure.querySelector(".house-image-button").dataset.work);const work=houseWorks[index];if(!work.details.length)return;const next=(detailIndex+work.details.length)%work.details.length;const image=figure.querySelector(".house-image");figure.dataset.detailIndex=String(next);image.src=work.details[next];image.alt=`${work.title}, detail ${next+1}`;figure.querySelector(".house-detail-controls").hidden=false;figure.querySelector(".house-detail-count").textContent=`detail ${next+1} / ${work.details.length}`;activeFigure=figure}
function moveSlide(figure,delta){const index=Number(figure.querySelector(".house-image-button").dataset.work);const total=houseWorks[index].details.length;if(!total)return;const current=Number(figure.dataset.detailIndex??-1);if(delta>0){if(current===total-1)showFull(figure,true);else showDetail(figure,current+1)}else{if(current===-1)showDetail(figure,total-1);else if(current===0)showFull(figure,true);else showDetail(figure,current-1)}}
series.addEventListener("click",event=>{const returnButton=event.target.closest(".house-full-return");if(returnButton){showFull(returnButton.closest(".house-work"));return}const imageButton=event.target.closest(".house-image-button");if(imageButton)moveSlide(imageButton.closest(".house-work"),1)});
document.addEventListener("keydown",event=>{if(!activeFigure)return;if(event.key==="ArrowRight"||event.key===" "){event.preventDefault();moveSlide(activeFigure,1)}if(event.key==="ArrowLeft"){event.preventDefault();moveSlide(activeFigure,-1)}if(event.key==="Escape")showFull(activeFigure)});
</script>
</body>
</html>
