</main></div><dialog class="viewer" aria-label="Watercolor studies"><button class="viewer-close" aria-label="Close enlarged painting">close ×</button><div class="viewer-stage"><figure class="viewer-artwork"><img class="viewer-image" alt=""><figcaption class="viewer-credit collaboration-credit" hidden>made with <a href="https://jessechun.com" target="_blank" rel="noopener">jesse chun</a></figcaption></figure></div><div class="viewer-controls"><button class="viewer-prev" aria-label="Previous painting">←</button><span class="viewer-count" aria-live="polite"></span><button class="viewer-next" aria-label="Next painting">→</button></div></dialog><script>
const menu=document.querySelector('.mobile-menu-button');

const paths=["watercolor%20experiments/001_jc.jpg", "watercolor%20experiments/002_jc.jpg", "watercolor%20experiments/j0001_jc.jpg", "watercolor%20experiments/003_jc.jpg", "watercolor%20experiments/004_jc.jpg", "watercolor%20experiments/005_jc.jpg", "watercolor%20experiments/006_jc.jpg", "watercolor%20experiments/007_jc.jpg", "watercolor%20experiments/008_jc.jpg", "watercolor%20experiments/010_jc.jpg", "watercolor%20experiments/015_jc.jpg", "watercolor%20experiments/j0034.jpg", "watercolor%20experiments/j0038%20copy.jpg", "watercolor%20experiments/009.jpg", "watercolor%20experiments/j0035.jpg", "watercolor%20experiments/011.jpg", "watercolor%20experiments/012.jpg", "watercolor%20experiments/013.jpg", "watercolor%20experiments/j0036%20copy.jpg", "watercolor%20experiments/014.jpg", "watercolor%20experiments/016.jpg", "watercolor%20experiments/j0033.jpg", "watercolor%20experiments/j0037%20copy.jpg"];
const collaborations=[true, true, true, true, true, true, true, true, true, true, true, false, false, false, false, false, false, false, false, false, false, false, false];
const dialog=document.querySelector('.viewer'),image=dialog.querySelector('img'),counter=dialog.querySelector('.viewer-count'),viewerCredit=dialog.querySelector('.viewer-credit');
const cache=new Map();let current=0,token=0,trigger=null,oldOverflow='';
function load(i){if(!cache.has(i))cache.set(i,new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{(img.decode?img.decode():Promise.resolve()).catch(()=>{}).then(()=>resolve(img));};img.onerror=()=>{cache.delete(i);reject(new Error('Image unavailable'));};img.src=paths[i];}));return cache.get(i);}
async function show(i){current=(i+paths.length)%paths.length;const ix=current,request=++token;try{const ready=await load(ix);if(request!==token||!dialog.open)return;image.src=ready.src;image.alt='Watercolor study '+(ix+1);counter.textContent=(ix+1)+' / '+paths.length;viewerCredit.hidden=!collaborations[ix];load((ix+1)%paths.length).catch(()=>{});load((ix+paths.length-1)%paths.length).catch(()=>{});}catch(e){if(request===token)counter.textContent='Image unavailable';}}
document.querySelectorAll('.study').forEach(button=>{button.addEventListener('click',()=>{trigger=button;oldOverflow=document.body.style.overflow;document.body.style.overflow='hidden';dialog.showModal();show(Number(button.dataset.index));});button.addEventListener('pointerenter',()=>load(Number(button.dataset.index)).catch(()=>{}),{once:true});});
dialog.querySelector('.viewer-close').addEventListener('click',()=>dialog.close());
dialog.querySelector('.viewer-prev').addEventListener('click',()=>show(current-1));
dialog.querySelector('.viewer-next').addEventListener('click',()=>show(current+1));image.addEventListener('click',()=>show(current+1));
dialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1);}});
dialog.addEventListener('close',()=>{token++;document.body.style.overflow=oldOverflow;image.removeAttribute('src');counter.textContent='';viewerCredit.hidden=true;trigger?.focus({preventScroll:true});});
</script></body></html>
